    });
    sidebarOverlay.addEventListener('click', function () { setSidebar(false); });

    // =====================================================================
    // 10) DIŞ KÜTÜPHANELER – sadece gerektiğinde yüklenir
    // =====================================================================
    var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
    var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    var JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    var scriptCache = {};
    function loadScript(src) {
      if (scriptCache[src]) return scriptCache[src];
      scriptCache[src] = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src;
        s.async = true;
        var t = setTimeout(function () { reject(new Error('timeout')); }, 20000);
        s.onload = function () { clearTimeout(t); resolve(); };
        s.onerror = function () { clearTimeout(t); reject(new Error('load')); };
        document.head.appendChild(s);
      }).catch(function (err) { delete scriptCache[src]; throw err; });
      return scriptCache[src];
    }
    function ensurePdfJs() {
      return loadScript(PDFJS_URL).then(function () {
        if (!window.pdfjsLib) throw new Error('pdfjs');
        // Eski kodda worker ayarlanmamıştı → PDF açılmıyor / ana iş parçacığı donuyordu
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        return window.pdfjsLib;
      });
    }
    var NET_MSG = 'Bu özellik için internet bağlantısı gerekiyor (kütüphane yüklenemedi).';

    // =====================================================================
    // 11) PDF
    // =====================================================================
    var pdfInput = $('pdfInput');
    var pdfControls = $('pdfControls');
    var pageNumInput = $('pageNum');
    var pageCountSpan = $('pageCount');
    var pdfRendering = false, pdfPending = null, lastPdfW = 0, lastPdfH = 0;
    state.pdfFit = 'page';          // 'page' = sayfanın tamamı ekrana sığar, 'width' = ekran genişliğini doldurur
    var pdfNotes = {};              // PDF sayfa no -> { blob, geom } o sayfaya yazılanlar
    var pdfNotesVersion = 0;
    var pendingRestore = null;      // yeni sayfa çizilince geri getirilecek yazılar
    var pdfRenderTask = null, pdfWatchdog = null;
    state.pdfGeom = null;           // tuvaldeki yazıların ait olduğu PDF konumu/ölçeği

    function clearPdfNotes() { pdfNotes = {}; pdfNotesVersion++; pendingRestore = null; state.pdfGeom = null; }

    // Yazıları bir PDF konum/ölçeğinden diğerine taşır (yakınlaştırınca yazılar sayfayla birlikte büyür)
    function drawMapped(src, from, to) {
      var k = to.scale / from.scale;
      drawCtx.save();
      drawCtx.setTransform(k, 0, 0, k, (to.left - from.left * k) * S, (to.top - from.top * k) * S);
      drawCtx.globalAlpha = 1;
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.drawImage(src, 0, 0);
      drawCtx.restore();
    }
    function sameGeom(a, b) {
      return Math.abs(a.scale - b.scale) < 1e-6 && Math.abs(a.left - b.left) < 0.5 && Math.abs(a.top - b.top) < 0.5;
    }
    function clearUndo() {
      var pg = state.boardPages[state.activeBoardPage];
      pg.history.forEach(dropSnap); pg.redoStack.forEach(dropSnap);
      pg.history = []; pg.redoStack = [];
    }

    // Sayfadan çıkarken yazılanları sakla, yeni sayfanınkileri geri getir
    function swapPdfNotes(oldPage, newPage) {
      finishStroke(null);
      var snap = makeSnap();
      var ver = pdfNotesVersion;
      var geom = state.pdfGeom;
      if (geom) {
        if (snap.toBlob) {
          snap.toBlob(function (b) {
            if (ver === pdfNotesVersion && b) pdfNotes[oldPage] = { blob: b, geom: geom };
            dropSnap(snap);
          }, 'image/png');
        } else {
          pdfNotes[oldPage] = { canvas: snap, geom: geom };   // çok eski tarayıcı
        }
      } else dropSnap(snap);
      clearCtx(drawCtx);
      clearCtx(previewCtx);
      clearUndo();                       // geri-al, diğer sayfanın çizimini geri getirmesin
      state.pdfGeom = null;
      pendingRestore = pdfNotes[newPage] || null;   // sayfa çizilince doğru ölçekle geri gelir
    }

    function applyPendingRestore(num, geom) {
      var saved = pendingRestore;
      pendingRestore = null;
      if (!saved) return;
      var ver = pdfNotesVersion;
      if (saved.canvas) { drawMapped(saved.canvas, saved.geom, geom); return; }
      var url = URL.createObjectURL(saved.blob);
      var img = new Image();
      img.onload = function () {
        if (ver === pdfNotesVersion && state.pageNum === num && state.pdfGeom) drawMapped(img, saved.geom, state.pdfGeom);
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }

    pdfInput.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) { pdfInput.value = ''; return; }
      setSidebar(false);
      var reader = new FileReader();
      reader.onload = function () {
        var data = new Uint8Array(reader.result);
        ensurePdfJs().then(function (lib) {
          return lib.getDocument({ data: data }).promise;
        }).then(function (pdf) {
          if (state.pdfDoc) { try { state.pdfDoc.destroy(); } catch (_) {} }
          state.pdfDoc = pdf;
          state.zoomScale = 1;
          state.pdfFit = 'page';
          clearPdfNotes();
          pdfPageInfo = null; pdfRendered = { num: 0, scale: 0 }; pdfCrops = {};
          pageCountSpan.textContent = '/ ' + pdf.numPages;
          pageNumInput.max = pdf.numPages;
          pdfControls.classList.remove('hidden');
          state.pageNum = 1;
          pageNumInput.value = 1;
          updatePdfBar();
          resetPan();
          renderPdfPage(1);
        }).catch(function (err) {
          console.warn(err);
          alert(err && (err.message === 'timeout' || err.message === 'load' || err.message === 'pdfjs') ? NET_MSG : 'PDF açılamadı.');
        });
      };
      reader.readAsArrayBuffer(file);
    });

    function updatePdfBar() {
      $('zoomLevel').textContent = Math.round(state.zoomScale * 100) + '%';
      $('btnFitPage').classList.toggle('pb-on', state.pdfFit === 'page');
      $('btnFitWidth').classList.toggle('pb-on', state.pdfFit === 'width');
      if (state.pdfDoc) {
        $('prevPage').disabled = state.pageNum <= 1;
        $('nextPage').disabled = state.pageNum >= state.pdfDoc.numPages;
      }
    }

    // ---------------------------------------------------------------
    // PDF çizimi: sayfa bir kez yüksek çözünürlükte çizilir; Tam Sayfa /
    // Genişlik / yakınlaştırma sadece boyut değiştirir → anında çalışır,
    // PDF.js'in o an meşgul olmasına bağlı değildir.
    // ---------------------------------------------------------------
    var pdfPageInfo = null;        // { num, w, h, crop } ölçek 1'deki sayfa boyutu
    var pdfCrops = {};             // sayfa no -> boş kenarlar atılmış içerik alanı (0..1 oranları)

    // Sayfadaki beyaz kenar boşluklarını bulur (kapak sayfalarında çok geniş olabiliyor)
    function detectCrop(src) {
      try {
        var sw = Math.min(320, src.width), sh = Math.max(1, Math.round(src.height * sw / src.width));
        var c = document.createElement('canvas');
        c.width = sw; c.height = sh;
        var x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, sw, sh);
        x.drawImage(src, 0, 0, sw, sh);
        var d = x.getImageData(0, 0, sw, sh).data;
        var minX = sw, minY = sh, maxX = -1, maxY = -1;
        for (var yy = 0; yy < sh; yy++) {
          for (var xx = 0; xx < sw; xx++) {
            var i = (yy * sw + xx) * 4;
            if (d[i] < 238 || d[i + 1] < 238 || d[i + 2] < 238) {
              if (xx < minX) minX = xx; if (xx > maxX) maxX = xx;
              if (yy < minY) minY = yy; if (yy > maxY) maxY = yy;
            }
          }
        }
        if (maxX < 0) return null;
        var m = 0.02;
        var cx0 = Math.max(0, minX / sw - m), cy0 = Math.max(0, minY / sh - m);
        var cx1 = Math.min(1, (maxX + 1) / sw + m), cy1 = Math.min(1, (maxY + 1) / sh + m);
        if (cx1 - cx0 > 0.9 && cy1 - cy0 > 0.9) return null;      // zaten dolu sayfa
        if (cx1 - cx0 < 0.05 || cy1 - cy0 < 0.05) return null;    // neredeyse boş sayfa
        return { x: cx0, y: cy0, w: cx1 - cx0, h: cy1 - cy0 };
      } catch (_) { return null; }
    }
    var pdfRendered = { num: 0, scale: 0 };   // pdfCanvas'taki görüntünün sayfası ve piksel ölçeği

    function pdfCssScale(info) {
      var ww = workspace.clientWidth, wh = workspace.clientHeight;
      var cr = info.crop || { x: 0, y: 0, w: 1, h: 1 };
      info = { w: info.w * cr.w, h: info.h * cr.h };          // içerik alanına göre sığdır
      // 'width' = Ekranı Doldur: sayfa, ekranda hiç boşluk kalmayacak kadar büyür
      // (dikey sayfada genişliği, yatay/geniş sayfada yüksekliği doldurur)
      var base = state.pdfFit === 'width'
        ? Math.max(ww / info.w, wh / info.h)
        : Math.min(ww / info.w, wh / info.h);
      return base * state.zoomScale;
    }

    // Sayfanın ekrandaki yerini/boyutunu uygular (anında)
    function layoutPdf() {
      var info = pdfPageInfo;
      if (!state.pdfDoc || !info || info.num !== state.pageNum) { updatePdfBar(); return; }
      var ww = workspace.clientWidth, wh = workspace.clientHeight;
      lastPdfW = ww; lastPdfH = wh;
      var cssScale = pdfCssScale(info);
      var w = info.w * cssScale, h = info.h * cssScale;
      var cr = info.crop || { x: 0, y: 0, w: 1, h: 1 };
      var cw = w * cr.w, ch = h * cr.h;                          // ekrandaki içerik boyutu
      var pl = (cw < ww ? (ww - cw) / 2 : 0) - cr.x * w;         // sayfanın sol-üst köşesi
      var pt = (ch < wh ? (wh - ch) / 2 : 0) - cr.y * h;
      pdfCanvas.style.width = w + 'px';
      pdfCanvas.style.height = h + 'px';
      pdfCanvas.style.left = pl + 'px';
      pdfCanvas.style.top = pt + 'px';
      growCanvas(Math.max(ww, pl + w), Math.max(wh, pt + h));

      // yazıları PDF ile hizalı tut
      var geom = { page: info.num, left: pl, top: pt, scale: cssScale };
      if (pendingRestore) {
        state.pdfGeom = geom;
        applyPendingRestore(info.num, geom);
      } else if (state.pdfGeom && state.pdfGeom.page === info.num && !sameGeom(state.pdfGeom, geom)) {
        finishStroke(null);
        var snap = makeSnap();
        clearCtx(drawCtx);
        drawMapped(snap, state.pdfGeom, geom);
        dropSnap(snap);
        clearUndo();
        state.pdfGeom = geom;
      } else {
        state.pdfGeom = geom;
      }
      updatePdfBar();

      // görüntü bu boyut için bulanık kalırsa arka planda daha keskin çiz
      var need = cssScale * Math.min(window.devicePixelRatio || 1, 2);
      if (pdfRendered.num !== info.num || pdfRendered.scale < need * 0.95) {
        if (pdfRendered.num === info.num && pdfRendered.scale >= maxPixelScale(info) * 0.99) return;
        renderPdfPage(info.num);
      }
    }

    function maxPixelScale(info) { return Math.sqrt(12e6 / (info.w * info.h)); }

    function renderPdfPage(num) {
      if (!state.pdfDoc) return;
      if (pdfRendering) { pdfPending = num; return; }
      pdfRendering = true;
      clearTimeout(pdfWatchdog);
      pdfWatchdog = setTimeout(function () { finish(); }, 25000);   // takılırsa kilitli kalmasın
      var doc = state.pdfDoc;
      doc.getPage(num).then(function (page) {
        if (doc !== state.pdfDoc) return;
        var vp1 = page.getViewport({ scale: 1 });
        pdfPageInfo = { num: num, w: vp1.width, h: vp1.height, crop: pdfCrops[num] || null };
        if (num === state.pageNum) layoutPdf();          // boyut hemen uygulanır

        // Hem Tam Sayfa hem Genişlik için yeterince keskin olacak ölçekte çiz
        var ww = workspace.clientWidth, wh = workspace.clientHeight;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var want = Math.max(Math.max(ww / vp1.width, wh / vp1.height), pdfCssScale(pdfPageInfo)) * dpr;
        if (!(num in pdfCrops)) want = Math.max(want, 1.2 * dpr);   // ilk çizimde kenar tespiti için yeterli çözünürlük
        var scale = Math.min(want, maxPixelScale(pdfPageInfo));
        if (pdfRendered.num === num && pdfRendered.scale >= scale * 0.99) return;
        var vp = page.getViewport({ scale: scale });
        var off = document.createElement('canvas');
        off.width = Math.floor(vp.width);
        off.height = Math.floor(vp.height);
        pdfRenderTask = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
        return pdfRenderTask.promise.then(function () {
          if (doc !== state.pdfDoc || num !== state.pageNum) return;
          pdfCanvas.width = off.width;
          pdfCanvas.height = off.height;
          pdfCtx.drawImage(off, 0, 0);
          off.width = 0; off.height = 0;
          pdfRendered = { num: num, scale: scale };
          if (!(num in pdfCrops)) {
            pdfCrops[num] = detectCrop(pdfCanvas);
            if (pdfPageInfo && pdfPageInfo.num === num) {
              pdfPageInfo.crop = pdfCrops[num];
              if (pdfCrops[num]) layoutPdf();                    // boşluklar atılınca yeniden yerleştir
            }
          }
        });
      }).then(finish, function (err) { console.warn(err); finish(); });

      function finish() {
        if (!pdfRendering) return;
        clearTimeout(pdfWatchdog);
        pdfRenderTask = null;
        pdfRendering = false;
        if (pdfPending !== null) {
          var n = pdfPending; pdfPending = null;
          renderPdfPage(n);
        } else if (state.pdfDoc && pdfRendered.num !== state.pageNum) {
          renderPdfPage(state.pageNum);
        }
      }
    }

    $('pdfCloseButton').addEventListener('click', function () {
      if (state.pdfDoc) { try { state.pdfDoc.destroy(); } catch (_) {} }
      state.pdfDoc = null;
      clearPdfNotes();
      pdfPageInfo = null; pdfRendered = { num: 0, scale: 0 }; pdfCrops = {};
      pdfCanvas.width = 0; pdfCanvas.height = 0;
      pdfControls.classList.add('hidden');
      pdfInput.value = '';
      resetPan();
    });
    function gotoPdfPage(n) {
      if (!state.pdfDoc) return;
      var target = clamp(parseInt(n, 10) || 1, 1, state.pdfDoc.numPages);
      pageNumInput.value = target;
      if (target === state.pageNum) return;
      var old = state.pageNum;
      state.pageNum = target;
      resetPan();
      swapPdfNotes(old, target);
      renderPdfPage(target);
      updatePdfBar();
    }
    $('prevPage').addEventListener('click', function () { gotoPdfPage(state.pageNum - 1); });
    $('nextPage').addEventListener('click', function () { gotoPdfPage(state.pageNum + 1); });
    pageNumInput.addEventListener('change', function () { gotoPdfPage(pageNumInput.value); });
    pageNumInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { gotoPdfPage(pageNumInput.value); pageNumInput.blur(); }
    });
    pageNumInput.addEventListener('focus', function () { try { pageNumInput.select(); } catch (_) {} });
    $('zoomIn').addEventListener('click', function () { state.zoomScale = Math.min(4, state.zoomScale * 1.2); layoutPdf(); });
    $('zoomOut').addEventListener('click', function () { state.zoomScale = Math.max(0.3, state.zoomScale / 1.2); layoutPdf(); });
    $('btnFitPage').addEventListener('click', function () { state.pdfFit = 'page'; state.zoomScale = 1; resetPan(); layoutPdf(); });
    $('btnFitWidth').addEventListener('click', function () { state.pdfFit = 'width'; state.zoomScale = 1; resetPan(); layoutPdf(); });

    // Klavye / sunum kumandası: PageDown, PageUp, ok tuşları
    document.addEventListener('keydown', function (e) {
      if (!state.pdfDoc) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
      if (e.key === 'PageDown' || e.key === 'ArrowRight') { e.preventDefault(); gotoPdfPage(state.pageNum + 1); }
      else if (e.key === 'PageUp' || e.key === 'ArrowLeft') { e.preventDefault(); gotoPdfPage(state.pageNum - 1); }
    });

    // =====================================================================
    // 12) RESİM (eski kodda "Resim Yükle" hiçbir şey yapmıyordu)
    // =====================================================================
    var imageInput = $('imageInput');
    imageInput.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      imageInput.value = '';
      if (!file) return;
      setSidebar(false);
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { addPlacedImage(img, url); };
      img.onerror = function () { URL.revokeObjectURL(url); alert('Resim açılamadı.'); };
      img.src = url;
    });

    function removePlacedImage(c) {
      if (c._url) URL.revokeObjectURL(c._url);
      if (c.parentNode) c.parentNode.removeChild(c);
    }

    function addPlacedImage(img, url) {
      var ww = workspace.clientWidth, wh = workspace.clientHeight;
      var ratio = img.naturalWidth / img.naturalHeight || 1;
      var w = Math.min(img.naturalWidth, ww * 0.5, 700);
      var h = w / ratio;
      if (h > wh * 0.6) { h = wh * 0.6; w = h * ratio; }
      var c = document.createElement('div');
      c.className = 'placed-image-container active';
      c._url = url;
      c._ratio = ratio;
      c._img = img;
      var x = (ww - w) / 2 - state.pan.x, y = (wh - h) / 2 - state.pan.y;
      c.style.left = x + 'px'; c.style.top = y + 'px';
      c.style.width = w + 'px'; c.style.height = h + 'px';
      img.draggable = false;
      c.appendChild(img);

      var del = document.createElement('div');
      del.className = 'handle delete-handle';
      del.setAttribute('data-act', 'delete');
      del.title = 'Sil';
      del.style.right = '-11px'; del.style.top = '-11px';
      var rs = document.createElement('div');
      rs.className = 'handle resize-handle';
      rs.setAttribute('data-act', 'resize');
      rs.title = 'Boyutlandır';
      rs.style.right = '-8px'; rs.style.bottom = '-8px';
      var stamp = document.createElement('button');
      stamp.type = 'button';
      stamp.className = 'img-bg-btn';
      stamp.textContent = 'Tahtaya Sabitle';
      stamp.addEventListener('click', function (ev) {
        ev.stopPropagation();
        saveCanvasState();
        identity(drawCtx, function () {
          drawCtx.drawImage(img, parseFloat(c.style.left) * S, parseFloat(c.style.top) * S,
            parseFloat(c.style.width) * S, parseFloat(c.style.height) * S);
        });
        removePlacedImage(c);
      });
      c.appendChild(del); c.appendChild(rs); c.appendChild(stamp);

      deactivateImages();
      imageLayer.appendChild(c);

      var mode = null, pid = null, sx = 0, sy = 0, st = null;
      c.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        if (e.target.closest && e.target.closest('.img-bg-btn')) return;
        if (pid !== null && !e.isPrimary) return;
        e.preventDefault(); e.stopPropagation();
        deactivateImages();
        c.classList.add('active');
        var act = e.target.getAttribute('data-act');
        if (act === 'delete') { removePlacedImage(c); return; }
        mode = act === 'resize' ? 'resize' : 'drag';
        sx = e.clientX; sy = e.clientY;
        st = { x: parseFloat(c.style.left), y: parseFloat(c.style.top), w: parseFloat(c.style.width) };
        pid = e.pointerId;
        try { c.setPointerCapture(pid); } catch (_) {}
      });
      c.addEventListener('pointermove', function (e) {
        if (e.pointerId !== pid || !mode) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if (mode === 'drag') {
          c.style.left = (st.x + dx) + 'px';
          c.style.top = (st.y + dy) + 'px';
        } else {
          var nw = clamp(st.w + dx, 40, 4000);
          c.style.width = nw + 'px';
          c.style.height = (nw / c._ratio) + 'px';
        }
      });
      var stop = function (e) {
        if (e.pointerId !== pid) return;
        mode = null; pid = null;
      };
      c.addEventListener('pointerup', stop);
      c.addEventListener('pointercancel', stop);
      c.addEventListener('lostpointercapture', stop);
    }

    // =====================================================================
    // 13) DIŞA AKTARMA (PNG / PDF)
    // =====================================================================
    function buildExportCanvas() {
      var out = document.createElement('canvas');
      out.width = drawCanvas.width;
      out.height = drawCanvas.height;
      var ctx = out.getContext('2d');
      var bg = getComputedStyle(workspace).backgroundColor;
      ctx.fillStyle = (!bg || bg === 'transparent' || bg === 'rgba(0, 0, 0, 0)') ? '#ffffff' : bg;
      ctx.fillRect(0, 0, out.width, out.height);
      if (state.pdfDoc && pdfCanvas.width) {
        ctx.drawImage(pdfCanvas,
          (parseFloat(pdfCanvas.style.left) || 0) * S, (parseFloat(pdfCanvas.style.top) || 0) * S,
          (parseFloat(pdfCanvas.style.width) || pdfCanvas.width) * S, (parseFloat(pdfCanvas.style.height) || pdfCanvas.height) * S);
      }
      Array.prototype.forEach.call(imageLayer.querySelectorAll('.placed-image-container'), function (c) {
        try {
          ctx.drawImage(c._img, parseFloat(c.style.left) * S, parseFloat(c.style.top) * S,
            parseFloat(c.style.width) * S, parseFloat(c.style.height) * S);
        } catch (_) {}
      });
      ctx.drawImage(drawCanvas, 0, 0);
      return out;
    }

    function downloadBlob(blob, name) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.download = name;
      a.href = url;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
    }

    $('exportPNG').addEventListener('click', function () {
      exportMenu.classList.remove('open');
      var out = buildExportCanvas();
      var name = 'cizim-' + Date.now() + '.png';
      if (out.toBlob) {
        out.toBlob(function (b) { if (b) downloadBlob(b, name); }, 'image/png');
      } else {
        var a = document.createElement('a');
        a.download = name; a.href = out.toDataURL('image/png');
        document.body.appendChild(a); a.click(); a.remove();
      }
    });

    $('exportPDF').addEventListener('click', function () {
      exportMenu.classList.remove('open');
      loadScript(JSPDF_URL).then(function () {
        var jsPDF = window.jspdf && window.jspdf.jsPDF;
        if (!jsPDF) throw new Error('load');
        var out = buildExportCanvas();
        var pw = out.width / S * 0.75, ph = out.height / S * 0.75;   // pt cinsinden, en-boy oranı korunur
        var doc = new jsPDF({ orientation: pw >= ph ? 'landscape' : 'portrait', unit: 'pt', format: [pw, ph] });
        doc.addImage(out.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, pw, ph);
        doc.save('cizim-' + Date.now() + '.pdf');
      }).catch(function (err) { console.warn(err); alert(NET_MSG); });
    });

    // =====================================================================
    // 14) TAM EKRAN
    // =====================================================================
    function toggleFullscreen() {
      var d = document, el = d.documentElement;
      var fs = d.fullscreenElement || d.webkitFullscreenElement;
      try {
        if (!fs) {
          var req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) { var p = req.call(el); if (p && p.catch) p.catch(function () {}); }
        } else {
          var ex = d.exitFullscreen || d.webkitExitFullscreen;
          if (ex) { var q = ex.call(d); if (q && q.catch) q.catch(function () {}); }
        }
      } catch (_) {}
    }
    $('btnFullscreen').addEventListener('click', toggleFullscreen);

    // =====================================================================
    // 15) GEOMETRİ ALETLERİ – çizimler
    // =====================================================================
    var IDPR = Math.min(window.devicePixelRatio || 1, 2);

    function renderRulerGraphics() {
      var c = $('rulerCanvas');
      var r = state.instruments.ruler;
      c.width = Math.round(r.width * IDPR);
      c.height = Math.round(80 * IDPR);
      var ctx = c.getContext('2d');
      ctx.setTransform(IDPR, 0, 0, IDPR, 0, 0);
      ctx.strokeStyle = '#134e4a';
      ctx.fillStyle = '#134e4a';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 1;
      var pxPerCm = 32;
      var totalCm = Math.floor(r.width / pxPerCm);
      ctx.beginPath();
      for (var i = 0; i <= totalCm * 10; i++) {
        var x = i * (pxPerCm / 10) + 0.5;
        var tickLen = (i % 10 === 0) ? 24 : (i % 5 === 0) ? 16 : 8;
        ctx.moveTo(x, 0);
        ctx.lineTo(x, tickLen);
      }
      ctx.stroke();
      for (var k = 1; k <= totalCm; k++) ctx.fillText(String(k), k * pxPerCm, 38);
    }

    var TRI_PAD = 6, PROT_STRIP = 16;
    function f1(n) { return n.toFixed(1); }

    // Açıölçer: şeffaf, 1° çentikli, çift ölçekli (dış siyah, iç kırmızı)
    function renderProtractorGraphics() {
      var prot = state.instruments.protractor;
      var r = prot.radius, full = prot.mode360;
      var W = 2 * r, H = full ? 2 * r : r + PROT_STRIP;
      var svg = $('protractorSvg');
      svg.setAttribute('width', W);
      svg.setAttribute('height', H);
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      var sc = clamp(r / 190, 0.55, 1.6);              // yarıçapa göre yazı/çentik ölçeği
      var cx = r, cy = r, R = r - 1, ri = r - 48 * sc;
      var shape = full
        ? 'M' + (cx - R) + ',' + cy + 'A' + R + ',' + R + ' 0 1 1 ' + (cx + R) + ',' + cy + 'A' + R + ',' + R + ' 0 1 1 ' + (cx - R) + ',' + cy + 'Z'
        : 'M1,' + (H - 1) + 'L1,' + cy + 'A' + R + ',' + R + ' 0 0 1 ' + (W - 1) + ',' + cy + 'L' + (W - 1) + ',' + (H - 1) + 'Z';
      var inner = full
        ? 'M' + (cx - ri) + ',' + cy + 'A' + ri + ',' + ri + ' 0 1 1 ' + (cx + ri) + ',' + cy + 'A' + ri + ',' + ri + ' 0 1 1 ' + (cx - ri) + ',' + cy
        : 'M' + (cx - ri) + ',' + cy + 'A' + ri + ',' + ri + ' 0 0 1 ' + (cx + ri) + ',' + cy;
      var maxDeg = full ? 359 : 180;
      var ticks = '', guides = '', labels = '';
      for (var d = 0; d <= maxDeg; d++) {
        var a = d * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
        var len = (d % 10 === 0 ? 15 : d % 5 === 0 ? 10 : 6) * Math.max(0.75, sc);
        ticks += 'M' + f1(cx + R * c) + ',' + f1(cy - R * sn) + 'L' + f1(cx + (R - len) * c) + ',' + f1(cy - (R - len) * sn);
        if (d % 10 === 0) {
          ticks += 'M' + f1(cx + ri * c) + ',' + f1(cy - ri * sn) + 'L' + f1(cx + (ri + 5) * c) + ',' + f1(cy - (ri + 5) * sn);
          guides += 'M' + f1(cx + 14 * c) + ',' + f1(cy - 14 * sn) + 'L' + f1(cx + ri * c) + ',' + f1(cy - ri * sn);
          var rot = 90 - d;
          var lo = full ? d : 180 - d;
          var x1 = cx + (r - 26 * sc) * c, y1 = cy - (r - 26 * sc) * sn;
          labels += '<text class="pl-o" style="font-size:' + f1(10 * sc) + 'px" x="' + f1(x1) + '" y="' + f1(y1) + '" text-anchor="middle" dominant-baseline="central" transform="rotate(' + rot + ' ' + f1(x1) + ' ' + f1(y1) + ')">' + lo + '</text>';
          if (!full) {
            var x2 = cx + (r - 39 * sc) * c, y2 = cy - (r - 39 * sc) * sn;
            labels += '<text class="pl-i" style="font-size:' + f1(8.5 * sc) + 'px" x="' + f1(x2) + '" y="' + f1(y2) + '" text-anchor="middle" dominant-baseline="central" transform="rotate(' + rot + ' ' + f1(x2) + ' ' + f1(y2) + ')">' + d + '</text>';
          }
        }
      }
      var base = full
        ? 'M' + (cx - R) + ',' + cy + 'L' + (cx + R) + ',' + cy + 'M' + cx + ',' + (cy - R) + 'L' + cx + ',' + (cy + R)
        : 'M8,' + cy + 'L' + (W - 8) + ',' + cy;
      svg.innerHTML =
        '<path d="' + shape + '" transform="translate(1.5,2.5)" fill="rgba(15,23,42,0.035)"/>' +
        '<path class="inst-shape" d="' + shape + '" fill="rgba(45,212,191,0.10)" stroke="#0d9488" stroke-width="1.5"/>' +
        '<path d="' + guides + '" stroke="rgba(13,148,136,0.18)" stroke-width="1"/>' +
        '<path d="' + inner + '" fill="none" stroke="rgba(13,148,136,0.6)" stroke-width="1"/>' +
        '<path d="' + base + '" stroke="#0f766e" stroke-width="1.2"/>' +
        '<path d="' + ticks + '" stroke="#134e4a" stroke-width="1"/>' +
        labels +
        '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="none" stroke="#dc2626" stroke-width="1.5"/>' +
        '<path d="M' + cx + ',' + (cy - 12) + 'L' + cx + ',' + (cy + (full ? 12 : PROT_STRIP - 3)) + 'M' + (cx - 12) + ',' + cy + 'L' + (cx + 12) + ',' + cy + '" stroke="#dc2626" stroke-width="1"/>';
    }

    function updateProtractorTransform() {
      var el = $('protractor');
      var p = state.instruments.protractor;
      el.style.width = (p.radius * 2) + 'px';
      el.style.height = (p.mode360 ? p.radius * 2 : p.radius + PROT_STRIP) + 'px';
      el.style.transformOrigin = p.radius + 'px ' + p.radius + 'px';
      el.style.transform = 'translate3d(' + (p.x - p.radius) + 'px, ' + (p.y - p.radius) + 'px, 0px) rotate(' + p.angle + 'deg)';
      // yeşil nokta taban çizgisinin sağ ucunda (0°), mavi nokta tam merkezde
      var gh = $('protractorResizeHandle');
      gh.style.left = (2 * p.radius - 8) + 'px';
      gh.style.top = (p.radius - 8) + 'px';
      var cd = $('protractorCenterDot');
      cd.style.left = (p.radius - 5) + 'px';
      cd.style.top = (p.radius - 5) + 'px';
    }

    // Gönye: şeffaf, ortası boş, iki dik kenarı cm/mm ölçülü (köşede 0)
    function renderTriangle45Graphics() {
      var s = state.instruments.triangle45.width, p = TRI_PAD, L = s - 2 * p;
      var svg = $('triangle45Svg');
      svg.setAttribute('width', s);
      svg.setAttribute('height', s);
      svg.setAttribute('viewBox', '0 0 ' + s + ' ' + s);
      var k = Math.max(34, L * 0.16);               // ortadaki boşluğun kenarlardan uzaklığı
      var outer = 'M' + p + ',' + p + 'L' + p + ',' + (s - p) + 'L' + (s - p) + ',' + (s - p) + 'Z';
      var hole = 'M' + f1(p + k) + ',' + f1(p + k + k * 1.4142) + 'L' + f1(p + k) + ',' + f1(s - p - k) + 'L' + f1(s - p - k - k * 1.4142) + ',' + f1(s - p - k) + 'Z';
      var ticks = '', labels = '', mm = 3.2;
      for (var i = 1; ; i++) {
        var off = i * mm;
        var len = i % 10 === 0 ? 13 : i % 5 === 0 ? 9 : 5;
        if (L - off < len + 4) break;
        ticks += 'M' + p + ',' + f1(s - p - off) + 'h' + len;
        ticks += 'M' + f1(p + off) + ',' + (s - p) + 'v' + (-len);
        if (i % 10 === 0 && L - off > 34) {
          labels += '<text class="tl" x="' + (p + 16) + '" y="' + f1(s - p - off) + '" dominant-baseline="central">' + (i / 10) + '</text>';
          labels += '<text class="tl" x="' + f1(p + off) + '" y="' + (s - p - 18) + '" text-anchor="middle">' + (i / 10) + '</text>';
        }
      }
      svg.innerHTML =
        '<path d="' + outer + hole + '" fill-rule="evenodd" transform="translate(1.5,2.5)" fill="rgba(15,23,42,0.035)"/>' +
        '<path class="inst-shape" d="' + outer + hole + '" fill-rule="evenodd" fill="rgba(45,212,191,0.10)" stroke="#0d9488" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<path d="' + ticks + '" stroke="#134e4a" stroke-width="1"/>' +
        labels;
    }

    function applyInstrumentTransform(key) {
      var el = $(key), inst = state.instruments[key];
      el.style.width = inst.width + 'px';
      el.style.height = inst.height + 'px';
      el.style.transform = 'translate3d(' + inst.x + 'px, ' + inst.y + 'px, 0px) rotate(' + inst.angle + 'deg)';
    }

    // Çalışma alanı (katman) koordinatını ekran koordinatına çevirir
    function layerToClient(x, y) {
      var r = workspace.getBoundingClientRect();
      return { x: r.left + state.pan.x + x, y: r.top + state.pan.y + y };
    }
    function clientToLayer(cx, cy) {
      var r = workspace.getBoundingClientRect();
      return { x: cx - r.left - state.pan.x, y: cy - r.top - state.pan.y };
    }
    function angleDiff(a, b) {           // -π..π aralığında fark (dönüşte 360° sıçramasını önler)
      var d = a - b;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    }

    var rafPending = {};
    function rafOnce(key, fn) {
      if (rafPending[key]) return;
      rafPending[key] = true;
      requestAnimationFrame(function () { rafPending[key] = false; fn(); });
    }

    // ---------- Ölçülü kenarlar: cetvelin çentikli kenarı, gönyenin iki dik kenarı ----------
    var EDGE_OUTSIDE = 30, EDGE_INSIDE = 26;
    function instPoint(inst, lx, ly) {
      var a = inst.angle * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
      var dx = lx - inst.width / 2, dy = ly - inst.height / 2;
      return { x: inst.x + inst.width / 2 + dx * c - dy * sn, y: inst.y + inst.height / 2 + dx * sn + dy * c };
    }
    function instVec(inst, vx, vy) {
      var a = inst.angle * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
      return { x: vx * c - vy * sn, y: vx * sn + vy * c };
    }
    function makeEdge(key, a, b, n) {
      var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      return { key: key, a: a, len: len, u: { x: dx / len, y: dy / len }, n: n };
    }
    function getEdges() {
      var list = [], I = state.instruments;
      if (I.ruler.visible) {
        var r = I.ruler;
        list.push(makeEdge('ruler', instPoint(r, 0, 0), instPoint(r, r.width, 0), instVec(r, 0, -1)));
      }
      if (I.triangle45.visible) {
        var t = I.triangle45, s = t.width, p = TRI_PAD;
        var B = instPoint(t, p, s - p);
        list.push(makeEdge('triangle45', B, instPoint(t, p, p), instVec(t, -1, 0)));
        list.push(makeEdge('triangle45', B, instPoint(t, s - p, s - p), instVec(t, 0, 1)));
      }
      return list;
    }
    function findEdge(pos, outside, inside, onlyKey) {
      var best = null;
      getEdges().forEach(function (ed) {
        if (onlyKey && ed.key !== onlyKey) return;
        var vx = pos.x - ed.a.x, vy = pos.y - ed.a.y;
        var t = vx * ed.u.x + vy * ed.u.y;
        if (t < -12 || t > ed.len + 12) return;
        var d = vx * ed.n.x + vy * ed.n.y;           // + dışarı, - aletin içi
        if (d > outside || d < -inside) return;
        if (!best || Math.abs(d) < Math.abs(best.d)) best = { edge: ed, t: clamp(t, 0, ed.len), d: d };
      });
      return best;
    }
    function edgeT(pos, ed) {
      return clamp((pos.x - ed.a.x) * ed.u.x + (pos.y - ed.a.y) * ed.u.y, 0, ed.len);
    }
    function drawEdgeLine(ctx, ed, t0, t1) {
      ctx.save();
      setDrawingStyle(ctx);
      var off = ctx.lineWidth / 2 + 1;               // çizgi kenara tam yaslanır
      ctx.beginPath();
      ctx.moveTo(ed.a.x + ed.u.x * t0 + ed.n.x * off, ed.a.y + ed.u.y * t0 + ed.n.y * off);
      ctx.lineTo(ed.a.x + ed.u.x * t1 + ed.n.x * off, ed.a.y + ed.u.y * t1 + ed.n.y * off);
      ctx.stroke();
      ctx.restore();
    }
    function canEdgeDraw() {
      return (state.currentTool === 'pen' || state.currentTool === 'highlighter') && state.selectedShape === 'free';
    }

    // Sürükleme oturumu: pencere düzeyinde dinler, kaçan "parmak kalktı" olayında kilitlenmez
    function dragSession(e, onMove, onEnd) {
      var pid = e.pointerId, ended = false;
      function mv(ev) { if (ev.pointerId === pid) onMove(ev); }
      function up(ev) { if (ev.pointerId === pid) end(); }
      function end() {
        if (ended) return;
        ended = true;
        window.removeEventListener('pointermove', mv);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        if (onEnd) onEnd();
      }
      window.addEventListener('pointermove', mv);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
      return { end: end };
    }

    // Cetvel & Gönye
    var instSessions = {};
    function setupInstrument(key) {
      var el = $(key);
      el.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        var actEl = e.target.closest ? e.target.closest('[data-action]') : null;
        var action = actEl ? actEl.getAttribute('data-action') : null;

        // Ölçülü kenarın üzerinden kalemle başlanırsa: aleti taşıma, düz çiz
        if (!action && canEdgeDraw()) {
          var hit = findEdge(getPos(e), 4, EDGE_INSIDE, key);
          if (hit) { e.preventDefault(); e.stopPropagation(); canvasPointerDown(e, hit); return; }
        }

        if (instSessions[key]) {
          if (!e.isPrimary) return;
          instSessions[key].end();
        }
        e.preventDefault(); e.stopPropagation();
        closeMenus(null);
        var inst = state.instruments[key];
        var b = el.getBoundingClientRect();
        var cx = b.left + b.width / 2, cy = b.top + b.height / 2;   // döndürme merkezi
        var sx = e.clientX, sy = e.clientY;
        var st = { x: inst.x, y: inst.y, w: inst.width, h: inst.height };
        var mode = action === 'rotate' ? 'rotate' : action === 'resize' ? 'resize' : 'drag';
        var prevPtr = Math.atan2(e.clientY - cy, e.clientX - cx);

        instSessions[key] = dragSession(e, function (ev) {
          if (mode === 'drag') {
            inst.x = st.x + (ev.clientX - sx);
            inst.y = st.y + (ev.clientY - sy);
          } else if (mode === 'rotate') {
            var cur = Math.atan2(ev.clientY - cy, ev.clientX - cx);
            inst.angle += angleDiff(cur, prevPtr) * 180 / Math.PI;
            prevPtr = cur;
          } else {
            var a = inst.angle * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
            var dx = ev.clientX - sx, dy = ev.clientY - sy;
            var lx = dx * cs + dy * sn, ly = -dx * sn + dy * cs;
            var nw, nh;
            if (key === 'ruler') { nw = clamp(st.w + lx, 200, 1400); nh = st.h; }
            else { nw = nh = clamp(st.w + (lx + ly) / 2, 160, 900); }
            var c0x = st.x + st.w / 2, c0y = st.y + st.h / 2;
            var hw = (nw - st.w) / 2, hh = (nh - st.h) / 2;
            var c1x = c0x + hw * cs - hh * sn, c1y = c0y + hw * sn + hh * cs;
            inst.x = c1x - nw / 2; inst.y = c1y - nh / 2;
            inst.width = nw; inst.height = nh;
            rafOnce(key, key === 'ruler' ? renderRulerGraphics : renderTriangle45Graphics);
          }
          applyInstrumentTransform(key);
        }, function () { instSessions[key] = null; });
      });
    }
    setupInstrument('ruler');
    setupInstrument('triangle45');

    // Açıölçer: gövdeden taşı, yeşil tutamaçlardan döndür
    (function setupProtractor() {
      var el = $('protractor');
      var session = null;
      el.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        if (e.target.closest && e.target.closest('#btnToggle360')) return;
        if (session) {
          if (!e.isPrimary) return;
          session.end();
        }
        e.preventDefault(); e.stopPropagation();
        closeMenus(null);
        var p = state.instruments.protractor;
        var actEl = e.target.closest ? e.target.closest('[data-action]') : null;
        var mode = actEl ? actEl.getAttribute('data-action') : 'drag';   // drag | rotate | resize
        var piv = layerToClient(p.x, p.y);
        var prevPtr = Math.atan2(e.clientY - piv.y, e.clientX - piv.x);
        var sx = e.clientX, sy = e.clientY, st = { x: p.x, y: p.y, r: p.radius };
        // işaretçiyi açıölçerin kendi eksenine çevirir (döndürülmüş olsa da tutamaç imleçle gider)
        function localX(ev) {
          var a = -p.angle * Math.PI / 180, dx = ev.clientX - piv.x, dy = ev.clientY - piv.y;
          return dx * Math.cos(a) - dy * Math.sin(a);
        }
        var startLX = localX(e);
        var startDist = Math.hypot(e.clientX - piv.x, e.clientY - piv.y);
        session = dragSession(e, function (ev) {
          if (mode === 'drag') {
            p.x = st.x + (ev.clientX - sx);
            p.y = st.y + (ev.clientY - sy);
          } else if (mode === 'resize') {
            // yeşil nokta: aynı anda büyüt/küçült ve döndür (nokta imleçle birlikte gider)
            var dist = Math.hypot(ev.clientX - piv.x, ev.clientY - piv.y);
            p.radius = clamp(st.r + (dist - startDist), 90, 560);
            var curA = Math.atan2(ev.clientY - piv.y, ev.clientX - piv.x);
            p.angle += angleDiff(curA, prevPtr) * 180 / Math.PI;
            prevPtr = curA;
            rafOnce('protractor', renderProtractorGraphics);
          } else {
            var cur = Math.atan2(ev.clientY - piv.y, ev.clientX - piv.x);
            p.angle += angleDiff(cur, prevPtr) * 180 / Math.PI;
            prevPtr = cur;
          }
          updateProtractorTransform();
        }, function () { session = null; });
      });

      $('btnToggle360').addEventListener('click', function (e) {
        e.stopPropagation();
        var p = state.instruments.protractor;
        p.mode360 = !p.mode360;
        renderProtractorGraphics();
        updateProtractorTransform();
      });
    })();

    // =====================================================================
    // 16) PERGEL (eski kodda hiçbir etkileşimi yoktu)
    //     Gri bacaklar = taşı, baş kısmı (tırtıllı sap) = döndür ve çiz,
    //     kalem ucu = yarıçapı ayarla
    // =====================================================================
    function updateCompassTransform() {
      var comp = state.compass;
      var container = $('compassContainer');
      container.style.left = comp.x + 'px';
      container.style.top = comp.y + 'px';
      container.style.transformOrigin = '180px 350px';
      container.style.transform = 'translate(-180px, -350px) rotate(' + comp.angle + 'deg)';

      var r = comp.radius;
      var hingeX = r / 2;
      $('legNeedle').setAttribute('d', 'M ' + hingeX + ',-180 L 0,0');
      $('legPencil').setAttribute('d', 'M ' + hingeX + ',-180 L ' + r + ',0');
      $('compassPivotOuter').setAttribute('cx', hingeX);
      $('compassPivotInner').setAttribute('cx', hingeX);
      $('topRotationHandle').setAttribute('transform', 'translate(' + (hingeX - 60) + ', 0)');
      $('thumbScrewGroup').setAttribute('transform', 'translate(' + (hingeX - 60) + ', 0)');
      $('pencilAssembly').setAttribute('transform', 'translate(' + r + ', 0)');
      $('radiusHandleCircle').setAttribute('cx', r);
      $('compassGuideCircle').setAttribute('r', r);
      $('compassRadiusLine').setAttribute('x2', r);
      $('compassInfoBadge').setAttribute('transform', 'translate(' + (r / 2) + ', -20)');
      $('compassRadiusText').textContent = (r / 32).toFixed(1) + ' cm';
    }

    function setCompassGuides(on) {
      var v = on ? '1' : '0';
      $('compassGuideCircle').setAttribute('opacity', v);
      $('compassRadiusLine').setAttribute('opacity', v);
      $('compassInfoBadge').setAttribute('opacity', v);
    }

    (function setupCompass() {
      var container = $('compassContainer');
      var mode = null, pid = null, sx = 0, sy = 0, st = null, needle = null, prevPtr = 0, startDist = 0, drewThisGesture = false;

      container.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        var roleEl = e.target.closest ? e.target.closest('[data-role]') : null;
        if (!roleEl) return;
        if (pid !== null && !e.isPrimary) return;
        e.preventDefault(); e.stopPropagation();
        var comp = state.compass;
        mode = roleEl.getAttribute('data-role');
        sx = e.clientX; sy = e.clientY;
        st = { x: comp.x, y: comp.y, r: comp.radius };
        needle = layerToClient(comp.x, comp.y);
        prevPtr = Math.atan2(e.clientY - needle.y, e.clientX - needle.x);
        startDist = Math.hypot(e.clientX - needle.x, e.clientY - needle.y);
        drewThisGesture = false;
        if (mode === 'rotate') $('pencilActiveRing').setAttribute('opacity', '1');
        if (mode === 'radius') setCompassGuides(true);
        pid = e.pointerId;
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      });

      function onMove(e) {
        if (e.pointerId !== pid || !mode) return;
        var comp = state.compass;
        if (mode === 'move') {
          comp.x = st.x + (e.clientX - sx);
          comp.y = st.y + (e.clientY - sy);
        } else {
          var cur = Math.atan2(e.clientY - needle.y, e.clientX - needle.x);
          var dA = angleDiff(cur, prevPtr);
          prevPtr = cur;
          var oldRad = comp.angle * Math.PI / 180;
          comp.angle += dA * 180 / Math.PI;
          if (mode === 'radius') {
            var d = Math.hypot(e.clientX - needle.x, e.clientY - needle.y);
            comp.radius = clamp(st.r + (d - startDist), 30, 700);
          } else if (mode === 'rotate' && dA !== 0) {
            if (!drewThisGesture) { saveCanvasState(); drewThisGesture = true; }
            var newRad = comp.angle * Math.PI / 180;
            drawCtx.save();
            resetCtx(drawCtx);
            drawCtx.lineCap = 'round';
            drawCtx.strokeStyle = state.penColor;
            drawCtx.lineWidth = state.penWidth;
            drawCtx.beginPath();
            drawCtx.arc(comp.x, comp.y, comp.radius, oldRad, newRad, newRad < oldRad);
            drawCtx.stroke();
            drawCtx.restore();
          }
        }
        rafOnce('compass', updateCompassTransform);
      }

      function onUp(e) {
        if (e.pointerId !== pid) return;
        mode = null; pid = null;
        setCompassGuides(false);
        $('pencilActiveRing').setAttribute('opacity', '0');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        updateCompassTransform();
      }
    })();

    // =====================================================================
    // 17) ALETLERİ GÖSTER / GİZLE
    // =====================================================================
    function bringIntoView(obj, w, h, minY) {
      var ww = workspace.clientWidth, wh = workspace.clientHeight;
      var x = obj.x + state.pan.x, y = obj.y + state.pan.y;
      if (x < 0 || x + w > ww || y < (minY || 0) || y + h > wh - 60) {
        obj.x = (ww - w) / 2 - state.pan.x;
        obj.y = Math.max(minY || 0, (wh - h) / 2) - state.pan.y;
      }
    }

    function bindToolBtn(btnId, key) {
      $(btnId).addEventListener('click', function () {
        var inst = state.instruments[key];
        inst.visible = !inst.visible;
        $(key).classList.toggle('hidden', !inst.visible);
        $(btnId).classList.toggle('bg-indigo-600', inst.visible);
        if (key === 'protractor') {
          if (inst.visible) {
            var ww = workspace.clientWidth, wh = workspace.clientHeight;
            if (inst.x + state.pan.x > ww - 40 || inst.y + state.pan.y > wh - 40) {
              inst.x = ww / 2 - state.pan.x; inst.y = wh / 2 - state.pan.y;
            }
          }
          updateProtractorTransform();
        } else {
          if (inst.visible) bringIntoView(inst, inst.width, inst.height, 0);
          applyInstrumentTransform(key);
        }
        if (inst.visible && window.innerWidth <= 700) setSidebar(false);
      });
    }
    bindToolBtn('btnRuler', 'ruler');
    bindToolBtn('btnProtractor', 'protractor');
    bindToolBtn('btnTriangle45', 'triangle45');

    $('btnCompass').addEventListener('click', function () {
      var comp = state.compass;
      comp.visible = !comp.visible;
      $('compassContainer').classList.toggle('hidden', !comp.visible);
      $('btnCompass').classList.toggle('bg-indigo-600', comp.visible);
      if (comp.visible) {
        var ww = workspace.clientWidth, wh = workspace.clientHeight;
        var x = comp.x + state.pan.x, y = comp.y + state.pan.y;
        if (x < 40 || x > ww - 40 || y < 260 || y > wh - 40) {
          comp.x = ww / 2 - state.pan.x;
          comp.y = clamp(wh * 0.62, 260, Math.max(260, wh - 60)) - state.pan.y;
        }
        if (window.innerWidth <= 700) setSidebar(false);
      }
      updateCompassTransform();
    });

    // =====================================================================
    // 18) BAŞLANGIÇ
    // =====================================================================
    function fitBrand() {
      var box = $('brandText'), sub = $('brandSub');
      if (!box || !sub) return;
      var size = 10;
      sub.style.fontSize = size + 'px';
      while (sub.scrollWidth > box.clientWidth && size > 6) {
        size -= 0.25;
        sub.style.fontSize = size + 'px';
      }
    }
    window.addEventListener('resize', fitBrand);

    function init() {
      fitBrand();
      resizeCanvases();
      setTool('hand', 'btnHand');          // açılışta Kaydır seçili
      var ww = workspace.clientWidth || 800;
      var r = state.instruments.ruler;
      r.width = Math.max(200, Math.min(480, Math.round(ww * 0.8)));
      if (ww < 500) {
        state.instruments.triangle45.width = state.instruments.triangle45.height = 230;
        state.instruments.protractor.radius = 150;
        state.compass.radius = 110;
      }
      renderRulerGraphics();
      renderProtractorGraphics();
      renderTriangle45Graphics();
      applyInstrumentTransform('ruler');
      applyInstrumentTransform('triangle45');
      updateProtractorTransform();
      updateCompassTransform();
      updatePageIndicator();
    }
    if (document.readyState === 'complete') init();
    else window.addEventListener('load', init);

  })();
  </script>
</body>
