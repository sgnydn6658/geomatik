<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <title>Gelişmiş Etkileşimli Matematik ve Geometri Tahtası</title>

  <!--
    NOT: Tailwind CDN ve Lucide CDN kaldırıldı. Sayfa artık açılışta hiçbir dış
    dosya beklemiyor (okul ağında CDN takılınca sayfa donuyordu). Gerekli stiller
    aşağıda, ikonlar ise script içinde gömülü.
    PDF.js ve jsPDF yalnızca "PDF Aç" / "PDF Belgesi" kullanılınca yükleniyor.
  -->

  <style>
    /* ---------- Temel sıfırlama ---------- */
    *, ::before, ::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: 0 solid #e5e7eb;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;          /* uzun basınca açılan menüyü engeller (iOS/Android) */
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }
    button, input, select, textarea {
      font-family: inherit; font-size: 100%; line-height: inherit; color: inherit; margin: 0;
    }
    button, [type=button] {
      -webkit-appearance: button; background-color: transparent; background-image: none; cursor: pointer;
      touch-action: manipulation;
    }
    textarea::placeholder, input::placeholder { color: #9ca3af; }
    img, svg, canvas { display: block; vertical-align: middle; }
    svg.ico { pointer-events: none; flex-shrink: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, 'DejaVu Sans', sans-serif;
      overscroll-behavior: none;
      line-height: 1.5;
    }

    /* ---------- Kullanılan yardımcı sınıflar (Tailwind yerine, eski tarayıcı uyumlu) ---------- */
    .relative{position:relative}.absolute{position:absolute}.fixed{position:fixed}
    .inset-0{top:0;right:0;bottom:0;left:0}
    .top-0{top:0}.left-0{left:0}.top-3{top:12px}.left-3{left:12px}.right-3{right:12px}.bottom-2{bottom:8px}
    .top-\[58px\]{top:58px}.top-\[122px\]{top:134px}
    .-top-3\.5{top:-8px}.-right-3\.5{right:-8px}.-bottom-3\.5{bottom:-8px}.-top-2{top:-8px}.-left-2{left:-8px}
    .left-\[calc\(50\%\+100px\)\]{left:calc(50% + 100px)}
    .z-0{z-index:0}.z-10{z-index:10}.z-15{z-index:15}.z-20{z-index:20}.z-30{z-index:30}.z-40{z-index:40}.z-50{z-index:50}
    .z-\[70\]{z-index:70}.z-\[80\]{z-index:80}.z-\[100\]{z-index:100}
    .flex{display:flex}
    .flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.shrink-0{flex-shrink:0}
    .items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
    .gap-1{gap:4px}.gap-1\.5{gap:6px}.gap-2{gap:8px}.gap-2\.5{gap:10px}.gap-3{gap:12px}
    .w-3{width:12px}.w-3\.5{width:14px}.w-4{width:16px}.w-5{width:20px}.w-6{width:24px}.w-7{width:28px}.w-8{width:32px}
    .w-12{width:48px}.w-14{width:56px}.w-20{width:80px}.w-40{width:160px}.w-48{width:192px}.w-52{width:208px}
    .w-full{width:100%}.w-px{width:1px}.w-screen{width:100vw}.min-w-0{min-width:0}
    .h-1\.5{height:6px}.h-3{height:12px}.h-3\.5{height:14px}.h-4{height:16px}.h-5{height:20px}.h-6{height:24px}
    .h-7{height:28px}.h-8{height:32px}.h-12{height:48px}.h-full{height:100%}
    .h-screen{height:100vh;height:100dvh}
    .p-1{padding:4px}.p-1\.5{padding:6px}.p-2{padding:8px}
    .px-1{padding-left:4px;padding-right:4px}.px-1\.5{padding-left:6px;padding-right:6px}.px-2{padding-left:8px;padding-right:8px}.px-3{padding-left:12px;padding-right:12px}
    .py-0\.5{padding-top:2px;padding-bottom:2px}.py-1{padding-top:4px;padding-bottom:4px}.py-1\.5{padding-top:6px;padding-bottom:6px}
    .py-2{padding-top:8px;padding-bottom:8px}.py-3{padding-top:12px;padding-bottom:12px}
    .pb-1{padding-bottom:4px}.pb-2\.5{padding-bottom:10px}.pt-1{padding-top:4px}.pt-2\.5{padding-top:10px}.pr-1{padding-right:4px}
    .ml-1{margin-left:4px}.ml-auto{margin-left:auto}.mt-2{margin-top:8px}
    .overflow-hidden{overflow:hidden}.overflow-visible{overflow:visible}.overflow-y-auto{overflow-y:auto}
    .rounded{border-radius:4px}.rounded-md{border-radius:6px}.rounded-lg{border-radius:8px}.rounded-xl{border-radius:12px}
    .rounded-full{border-radius:9999px}.rounded-t-full{border-top-left-radius:9999px;border-top-right-radius:9999px}
    .border{border-width:1px}.border-0{border-width:0}.border-b{border-bottom-width:1px}.border-r{border-right-width:1px}.border-t{border-top-width:1px}
    .border-slate-200{border-color:#e2e8f0}.border-slate-300{border-color:#cbd5e1}.border-slate-400{border-color:#94a3b8}
    .border-slate-600{border-color:#475569}.border-slate-700{border-color:#334155}.border-slate-800{border-color:#1e293b}
    .border-rose-200{border-color:#fecdd3}.border-rose-700\/60{border-color:rgba(190,18,60,.6)}
    .bg-white{background-color:#fff}.bg-black{background-color:#000}.bg-transparent{background-color:transparent}
    .bg-slate-700{background-color:#334155}.bg-slate-800{background-color:#1e293b}.bg-slate-900{background-color:#0f172a}
    .bg-blue-600{background-color:#2563eb}.bg-emerald-600{background-color:#059669}.bg-green-600{background-color:#16a34a}
    .bg-purple-600{background-color:#9333ea}.bg-red-600{background-color:#dc2626}.bg-yellow-600{background-color:#ca8a04}
    .bg-rose-900\/60{background-color:rgba(136,19,55,.6)}
    .bg-indigo-600{background-color:#4f46e5}
    .text-white{color:#fff}.text-slate-100{color:#f1f5f9}.text-slate-200{color:#e2e8f0}.text-slate-300{color:#cbd5e1}
    .text-slate-400{color:#94a3b8}.text-slate-500{color:#64748b}.text-slate-700{color:#334155}.text-slate-800{color:#1e293b}
    .text-indigo-300{color:#a5b4fc}.text-indigo-400{color:#818cf8}.text-indigo-600{color:#4f46e5}
    .text-amber-400{color:#fbbf24}.text-cyan-400{color:#22d3ee}.text-emerald-400{color:#34d399}.text-sky-400{color:#38bdf8}
    .text-rose-200{color:#fecdd3}.text-rose-400{color:#fb7185}.text-rose-700{color:#be123c}
    .text-xs{font-size:12px;line-height:16px}.text-sm{font-size:14px;line-height:20px}
    .text-\[10px\]{font-size:10px}.text-\[11px\]{font-size:11px}
    .font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
    .font-mono{font-family:ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace}
    .italic{font-style:italic}.uppercase{text-transform:uppercase}
    .tracking-wide{letter-spacing:.025em}.tracking-wider{letter-spacing:.05em}
    .text-left{text-align:left}.text-center{text-align:center}
    .antialiased{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    .select-none{user-select:none;-webkit-user-select:none}.resize-none{resize:none}
    .pointer-events-none{pointer-events:none}.pointer-events-auto{pointer-events:auto}
    .cursor-pointer{cursor:pointer}.cursor-crosshair{cursor:crosshair}.cursor-grab{cursor:grab}.cursor-ew-resize{cursor:ew-resize}
    .active\:cursor-grabbing:active{cursor:grabbing}
    .focus\:outline-none:focus{outline:2px solid transparent;outline-offset:2px}
    .accent-indigo-500{accent-color:#6366f1}
    .transition{transition:background-color .15s,color .15s,border-color .15s}
    .shadow-sm{box-shadow:0 1px 2px rgba(0,0,0,.05)}
    .shadow-md{box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)}
    .shadow-xl{box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
    .shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
    .ring-2.ring-indigo-500{box-shadow:0 0 0 2px #6366f1}
    .scale-110{transform:scale(1.1)}
    .-translate-x-1\/2{transform:translateX(-50%)}
    @media (hover:hover) {
      .hover\:bg-slate-700:hover{background-color:#334155}.hover\:bg-slate-800:hover{background-color:#1e293b}
      .hover\:bg-indigo-500:hover{background-color:#6366f1}.hover\:bg-indigo-50:hover{background-color:#eef2ff}
      .hover\:bg-emerald-500:hover{background-color:#10b981}.hover\:bg-rose-900:hover{background-color:#881337}
      .hover\:bg-rose-800\/80:hover{background-color:rgba(159,18,57,.8)}
      .hover\:text-white:hover{color:#fff}
    }
    /* "hidden" her zaman en son ve en güçlü olmalı */
    .hidden{display:none !important}

    /* ---------- Dokunmatik alan kuralları ---------- */
    #drawCanvas, #previewCanvas, #instrumentsLayer, #imageLayer, #workspace, .instrument, #compassContainer, .placed-image-container {
      touch-action: none;
    }
    #sidebar, #sidebar * { touch-action: pan-y; }
    #bottomPalette, #bottomPalette * { touch-action: pan-x pan-y; }

    /* ---------- Tahta Arka Planları ---------- */
    .board-bg { background-color: #ffffff; }
    .board-bg.grid-graph {
      background-image:
        linear-gradient(to right, rgba(51, 65, 85, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(51, 65, 85, 0.12) 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .board-bg.grid-dots {
      background-image: radial-gradient(rgba(51, 65, 85, 0.25) 1.5px, transparent 0);
      background-size: 24px 24px;
      background-position: -0.5px -0.5px;
    }
    .board-bg.grid-isometric {
      background-image: radial-gradient(rgba(51, 65, 85, 0.25) 1px, transparent 0);
      background-size: 30px 51.96px;
    }

    #previewCanvas { z-index: 15; }

    /* ---------- Geometri Aletleri ---------- */
    .instrument {
      position: absolute;
      left: 0; top: 0;
      touch-action: none;
      transform-origin: 0 0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      cursor: grab;
      z-index: 30;
    }
    .instrument:active { cursor: grabbing; }
    #ruler, #triangle45 { transform-origin: 50% 50%; }
    #ruler {
      background: rgba(45, 212, 191, 0.10);
      border: 1.5px solid #0d9488;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .glass-acrylic {
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(100, 116, 139, 0.5);
    }

    .geometry-icon {
      width: 22px; height: 22px; flex: 0 0 22px;
      stroke: currentColor; fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
      pointer-events: none;
    }

    /* ---------- Alt palet: sade ve küçük ---------- */
    #bottomPalette {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 2px;
      padding: 4px 6px;
      background: #0f172a;
      border: 1px solid #334155; border-radius: 14px;
      box-shadow: 0 6px 20px rgba(15,23,42,0.25);
      max-width: calc(100vw - 60px);
      overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    #bottomPalette::-webkit-scrollbar { display: none; }
    .bp-group { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
    .bp-btn {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; color: #cbd5e1;
    }
    .bp-btn.bp-sm { width: 24px; height: 24px; border-radius: 7px; font-weight: 700; font-size: 14px; }
    @media (hover:hover) { .bp-btn:hover { background: #1e293b; color: #fff; } }
    .bp-btn.bp-on, .bp-btn.bp-on:hover { background: #4f46e5; color: #fff; }
    .bp-danger { color: #fb7185; }
    .bp-page { font: 600 12px ui-monospace, 'DejaVu Sans Mono', monospace; color: #e2e8f0; min-width: 30px; text-align: center; }
    .bp-sep { width: 1px; height: 20px; background: #334155; margin: 0 5px; flex-shrink: 0; }
    .bp-color {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; margin: 0 2px;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .bp-color.on { box-shadow: 0 0 0 2px #0f172a, 0 0 0 4px #818cf8; }
    .bp-custom {
      position: relative; width: 20px; height: 20px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin: 0 2px;
      background: conic-gradient(#ef4444, #eab308, #22c55e, #06b6d4, #3b82f6, #a855f7, #ef4444);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .bp-custom.on { box-shadow: 0 0 0 2px #0f172a, 0 0 0 4px #818cf8; }
    .bp-custom input { position: absolute; inset: -6px; top: -6px; left: -6px; width: 32px; height: 32px; opacity: 0; cursor: pointer; border: 0; padding: 0; }
    .bp-range { width: 72px; accent-color: #6366f1; cursor: pointer; }
    .bp-val { font: 600 11px ui-monospace, 'DejaVu Sans Mono', monospace; color: #cbd5e1; width: 18px; text-align: center; }
    .instrument { will-change: transform; }

    /* ---------- Açılır-kapanır kenar çubuğu (çalışma alanı tüm ekranı kaplar) ---------- */
    #sidebar {
      position: fixed !important; left: 0; top: 0; bottom: 0;
      width: 200px !important; z-index: 80;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      box-shadow: none;
    }
    #sidebar.open { transform: translateX(0); box-shadow: 6px 0 24px rgba(15,23,42,0.25); }
    #sidebarTab {
      position: fixed; left: 0; top: 50%; z-index: 85;
      width: 22px; height: 64px; margin-top: -32px;
      border-radius: 0 12px 12px 0;
      background: #0f172a; color: #cbd5e1;
      border: 1px solid #334155; border-left: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 2px 2px 10px rgba(15,23,42,0.2);
      transition: left 0.22s ease, background-color .15s;
    }
    #sidebarTab::before { content: ''; position: absolute; left: 0; top: -10px; right: -14px; bottom: -10px; }
    #sidebarTab.open { left: 200px; }
    #sidebarTab svg { transition: transform 0.22s ease; }
    #sidebarTab.open svg { transform: rotate(180deg); }
    @media (hover:hover) { #sidebarTab:hover { background: #4f46e5; color: #fff; } }

    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 75;
    }
    #sidebarOverlay.open { display: block; }

    #exportMenu { display: none; }
    #exportMenu.open { display: flex; }

    #oldBrowserWarning {
      position: fixed; left: 50%; top: 10px; transform: translateX(-50%);
      z-index: 200; background: #be123c; color: #fff; padding: 8px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600;
    }


    @media (max-width: 700px) {
      #workspace { width: 100%; flex: 1 1 100%; }
      #bottomPalette {
        left: 50% !important;
        transform: translateX(-50%) !important;
        max-width: calc(100vw - 16px) !important;
        bottom: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
      }
      .tb-hide-sm { display: none; }
      .tb-select { max-width: 150px; }
      #topBar { top: 10px; right: 8px; }
      #textContent { font-size: 16px; }   /* iOS'ta odaklanınca yakınlaştırmayı engeller */
    }

    /* ---------- Tutamaçlar ---------- */
    .handle {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      cursor: pointer;
      z-index: 60;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      touch-action: none;
    }
    .handle::before {                       /* parmakla kolay tutulsun diye görünmez geniş alan */
      content: ''; position: absolute; left: -12px; top: -12px; right: -12px; bottom: -12px; border-radius: 50%;
    }
    .delete-handle { width: 22px; height: 22px; }
    .rotate-handle { background-color: #2563eb; }
    .resize-handle { background-color: #059669; }
    .delete-handle { background-color: #dc2626; }
    .delete-handle::after {
      content: '×'; display: block; color: #fff; font-weight: 700; font-size: 16px;
      line-height: 17px; text-align: center; pointer-events: none;
    }

    /* Pergel: sadece gövde parçaları dokunmayı alır, boş SVG alanı çizimi engellemez */
    #compassContainer {
      position: absolute;
      left: 0; top: 0;
      touch-action: none;
      z-index: 35;
      pointer-events: none;
    }
    #compassContainer [data-role] { pointer-events: auto; }
    #compassContainer [data-role="move"] { cursor: move; }

    .img-bg-btn {
      position: absolute;
      left: 4px; bottom: 4px;
      z-index: 70;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #64748b;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      cursor: pointer;
    }

    .placed-image-container {
      position: absolute;
      touch-action: none;
      z-index: 25;
      cursor: move;
      border: 2px dashed transparent;
      pointer-events: auto;
    }
    .placed-image-container img { width: 100%; height: 100%; pointer-events: none; max-width: none; }
    .placed-image-container.active { border-color: #2563eb; }
    .placed-image-container:not(.active) .handle,
    .placed-image-container:not(.active) .img-bg-btn { display: none; }

    .tb-on { background-color: #4f46e5 !important; }

    /* ---------- Şeffaf gönye ve açıölçer (SVG) ---------- */
    #triangle45, #protractor {
      pointer-events: none !important;
      background: transparent; border: 0; box-shadow: none;
    }
    #triangle45 .handle, #protractor .handle, #btnToggle360 { pointer-events: auto; }
    #protractorCenterDot {
      position: absolute; width: 10px; height: 10px; border-radius: 50%;
      background: #2563eb; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(37,99,235,.5);
      pointer-events: none; z-index: 61;
    }
    .inst-shape { pointer-events: visiblePainted; cursor: grab; }
    .inst-shape:active { cursor: grabbing; }
    #triangle45 svg, #protractor svg { overflow: visible; pointer-events: none; }
    .tl { font: 600 9px system-ui, Ubuntu, sans-serif; fill: #134e4a; }
    .pl-o { font: 700 10px system-ui, Ubuntu, sans-serif; fill: #134e4a; }
    .pl-i { font: 600 8.5px system-ui, Ubuntu, sans-serif; fill: #dc2626; }
    #btnToggle360 {
      position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%);
      background: #0f172a; color: #fff; font-size: 10px; font-weight: 600;
      padding: 3px 10px; border-radius: 999px; border: 1px solid #475569; white-space: nowrap;
    }

    /* ---------- PDF çubuğu (üst orta) ---------- */
    #pdfControls {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 72;
      display: flex; align-items: center; gap: 2px; padding: 4px;
      background: rgba(255,255,255,0.96); border: 1px solid #e2e8f0; border-radius: 12px;
      box-shadow: 0 2px 10px rgba(15,23,42,0.10); white-space: nowrap;
    }
    .pb-btn { height: 32px; min-width: 32px; padding: 0 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #334155; }
    .pb-btn:disabled { opacity: .35; cursor: default; }
    @media (hover:hover) { .pb-btn:not(:disabled):hover { background: #f1f5f9; } }
    .pb-btn.pb-text { font-size: 12px; font-weight: 600; padding: 0 9px; }
    .pb-btn.pb-on { background: #eef2ff; color: #4338ca; }
    .pb-close { color: #e11d48; }
    .pb-sep { width: 1px; height: 20px; background: #e2e8f0; margin: 0 3px; }
    .pb-pages { display: flex; align-items: center; gap: 4px; font: 600 13px system-ui, sans-serif; color: #475569; }
    .pb-pages input { width: 46px; height: 30px; border: 1px solid #cbd5e1; border-radius: 8px; text-align: center; font-weight: 700; font-size: 14px; color: #1e293b; background: #fff; -moz-appearance: textfield; }
    .pb-pages input::-webkit-inner-spin-button, .pb-pages input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .pb-zoom { font: 600 11px ui-monospace, 'DejaVu Sans Mono', monospace; color: #475569; min-width: 38px; text-align: center; }
    @media (max-width: 900px) {
      #pdfControls { top: 56px; }
      .pb-text { padding: 0 6px !important; font-size: 11px !important; }
    }
    @media (max-width: 520px) {
      .pb-zoom, #zoomIn, #zoomOut { display: none; }
    }

    /* ---------- Sağ üst araç çubuğu ---------- */
    #topBar {
      position: absolute; top: 12px; right: 12px; z-index: 70;
      display: flex; align-items: center; gap: 2px; padding: 4px;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0; border-radius: 12px;
      box-shadow: 0 2px 10px rgba(15,23,42,0.08);
    }
    .tb-rel { position: relative; }

<body oncontextmenu="var t=event.target;return !!(t&&t.closest&&t.closest('textarea'));" class="h-screen w-screen flex text-slate-800 antialiased select-none overflow-hidden bg-white">

      <!-- Dosya İşlemleri -->

    <!-- Alt Butonlar -->
    <div class="flex flex-col gap-1.5 border-t border-slate-800 pt-2.5">
      <div class="flex items-center justify-between gap-1">
        <button id="btnUndo" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-white transition flex-1 flex justify-center" title="Geri Al">

        </button>

  <!-- 2. ÇALIŞMA ALANI (WORKSPACE) -->
  <main id="workspace" class="relative flex-1 board-bg bg-white overflow-hidden">

          <option value="polygon">⬡ Düzgün Çokgen</option>

      <div class="tb-sep"></div>

      </div>
      <div class="tb-sep"></div>
      <div id="backgroundPicker" class="tb-rel">

        </button>
        <div id="backgroundPickerMenu" class="tb-panel hidden">
          <div class="tb-panel-title">Arka Plan</div>

            <button type="button" data-board-bg="graph" class="board-bg-option"><span class="sw sw-graph"></span>Kareli</button>

    <!-- PDF çubuğu: sayfa geçişi, yakınlaştırma, sığdırma, kapat -->

              <path d="M -2,13 L 0,18 L 2,13 Z" fill="#0f172a"/>
              <circle id="pencilActiveRing" cx="0" cy="2" r="18" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" opacity="0"/>

              <rect x="46" y="-197" width="28" height="22" rx="9" fill="#374151"/>
              <rect x="55.5" y="-234" width="9" height="38" rx="2.5" fill="#6b7280"/>
              <path d="M 55.5,-229 H 64.5 M 55.5,-225 H 64.5 M 55.5,-221 H 64.5 M 55.5,-217 H 64.5 M 55.5,-213 H 64.5 M 55.5,-209 H 64.5 M 55.5,-205 H 64.5 M 55.5,-201 H 64.5" stroke="#374151" stroke-width="1.2"/>

            <circle id="compassPivotOuter" data-role="move" cx="60" cy="-180" r="8" fill="#1f2937"/>
            <circle id="compassPivotInner" cx="60" cy="-180" r="2.6" fill="#e5e7eb" pointer-events="none"/>


            <g id="radiusHandle" data-role="radius" class="cursor-ew-resize" opacity="0">

    </div>
  </main>

  <!-- 4. ALT PALET -->
  <div id="bottomPalette">

      <button id="btnNextBoardPage" type="button" class="bp-btn" title="Sonraki sayfa"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>

    <div class="bp-sep"></div>

    <div class="bp-group">
      <button id="btnHand" type="button" class="draw-tool bp-btn" title="Kaydır"><i data-lucide="hand" class="w-4 h-4"></i></button>

    // =====================================================================
    // 1) UZUN BASINCA AÇILAN SAĞ TIK MENÜSÜNÜ ENGELLE
    // =====================================================================
    function allowNative(t) {

    }
    document.addEventListener('contextmenu', function (e) {
      if (!allowNative(e.target)) { e.preventDefault(); e.stopPropagation(); }

    });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    window.addEventListener('contextmenu', function (e) { if (!allowNative(e.target)) e.preventDefault(); }, true);
    document.addEventListener('auxclick', function (e) { if (e.button === 2) e.preventDefault(); }, true);

    // =====================================================================
    // 2) DURUM
    // =====================================================================
    var MAX_HISTORY = 15;
    var PIX_BUDGET = 5e6;                         // çizim tuvali için en fazla piksel
    var SNAP_BUDGET = clamp((navigator.deviceMemory || 2) * 40e6, 80e6, 240e6); // geri-al belleği (bayt)

    var state = {
      pdfDoc: null,
      pageNum: 1,
      zoomScale: 1.0,

      activeBoardPage: 0,
      boardPages: [{ history: [], redoStack: [], current: null }],

      isDrawing: false,
      activePointerId: null,
      currentTool: 'pen',
      isPanning: false,
      panStart: null,
      panDelta: { x: 0, y: 0 },
      pan: { x: 0, y: 0 },
      selectedShape: 'free',
      penColor: '#000000',
      penWidth: 3,

      isBold: false,
      isItalic: false,
      pendingTextPos: null,

      shapeStart: null,
      anglePoints: [],
      polygonSides: 5,

      instruments: {
        ruler: { x: 160, y: 100, angle: 0, width: 480, height: 80, visible: false },
        protractor: { x: 400, y: 300, angle: 0, radius: 190, mode360: false, visible: false },
        triangle45: { x: 340, y: 140, angle: 0, width: 300, height: 300, visible: false }
      },

      compass: { x: 400, y: 300, radius: 150, angle: 0, visible: false },
      edgeDraw: null
    };

    var workspace = $('workspace');
    var pdfCanvas = $('pdfCanvas');
    var pdfCtx = pdfCanvas.getContext('2d');
    var drawCanvas = $('drawCanvas');
    var drawCtx = drawCanvas.getContext('2d');
    var previewCanvas = $('previewCanvas');
    var previewCtx = previewCanvas.getContext('2d');
    var imageLayer = $('imageLayer');
    var instrumentsLayer = $('instrumentsLayer');
    var textInputBox = $('textInputBox');
    var textContent = $('textContent');
    var fontSizeInput = $('fontSizeInput');
    var panLayers = [pdfCanvas, drawCanvas, previewCanvas, imageLayer, instrumentsLayer];

    var S = 1;               // CSS pikseli başına tuval pikseli (keskinlik / bellek dengesi)
    var scaleFixed = false;
    var logicalW = 0, logicalH = 0;

    function identity(ctx, fn) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      fn();
      ctx.restore();
    }
    function clearCtx(ctx) {
      identity(ctx, function () { ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); });
    }
    function resetCtx(ctx) {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // =====================================================================
    // 3) GERİ AL / İLERİ AL (bellek sınırlı, sayfa başına)
    // =====================================================================
    var snapPool = [];
    function makeSnap() {
      var c = null;
      for (var i = 0; i < snapPool.length; i++) {
        if (snapPool[i].width === drawCanvas.width && snapPool[i].height === drawCanvas.height) {
          c = snapPool.splice(i, 1)[0]; break;
        }
      }
      if (!c) {
        c = document.createElement('canvas');
        c.width = drawCanvas.width;
        c.height = drawCanvas.height;
      }
      var x = c.getContext('2d');
      x.clearRect(0, 0, c.width, c.height);
      x.drawImage(drawCanvas, 0, 0);
      return c;
    }
    function dropSnap(c) {
      if (!c) return;
      if (snapPool.length < 3) snapPool.push(c);
      else { c.width = 0; c.height = 0; }
    }
    function snapBytes(c) { return c ? c.width * c.height * 4 : 0; }

    function enforceBudget() {
      var total = 0;
      state.boardPages.forEach(function (p) {
        p.history.forEach(function (c) { total += snapBytes(c); });
        p.redoStack.forEach(function (c) { total += snapBytes(c); });
        total += snapBytes(p.current);
      });
      var active = state.boardPages[state.activeBoardPage];
      while (total > SNAP_BUDGET) {
        var arr = null, j;
        for (j = 0; j < state.boardPages.length && !arr; j++) {
          if (state.boardPages[j] !== active && state.boardPages[j].redoStack.length) arr = state.boardPages[j].redoStack;
        }
        for (j = 0; j < state.boardPages.length && !arr; j++) {
          if (state.boardPages[j] !== active && state.boardPages[j].history.length) arr = state.boardPages[j].history;
        }
        if (!arr && active.history.length > 1) arr = active.history;
        if (!arr && active.redoStack.length) arr = active.redoStack;
        if (!arr) break;
        var victim = arr.shift();
        total -= snapBytes(victim);
        dropSnap(victim);
      }
    }

    function saveCanvasState() {
      var page = state.boardPages[state.activeBoardPage];
      if (page.history.length >= MAX_HISTORY) dropSnap(page.history.shift());
      page.history.push(makeSnap());
      page.redoStack.forEach(dropSnap);
      page.redoStack = [];
      enforceBudget();
    }

    function restoreCanvasState(snap) {
      if (!snap) return;
      identity(drawCtx, function () {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        drawCtx.drawImage(snap, 0, 0);
      });
    }

    $('btnUndo').addEventListener('click', function () {
      var page = state.boardPages[state.activeBoardPage];
      if (!page.history.length) return;
      page.redoStack.push(makeSnap());
      var prev = page.history.pop();
      restoreCanvasState(prev);
      dropSnap(prev);
      enforceBudget();
    });

    $('btnRedo').addEventListener('click', function () {
      var page = state.boardPages[state.activeBoardPage];
      if (!page.redoStack.length) return;
      page.history.push(makeSnap());
      var next = page.redoStack.pop();
      restoreCanvasState(next);
      dropSnap(next);
      enforceBudget();
    });

    // =====================================================================
    // 4) TAHTA SAYFALARI
    //    (Eski kodda sayfa değiştirince SON ÇİZGİ kayboluyordu – düzeltildi)
    // =====================================================================
    function updatePageIndicator() {
      $('boardPageIndicator').textContent = (state.activeBoardPage + 1) + '/' + state.boardPages.length;
    }

    function loadBoardPage(index) {
      state.activeBoardPage = index;
      clearCtx(drawCtx);
      var page = state.boardPages[index];
      if (page.current) {
        restoreCanvasState(page.current);
        dropSnap(page.current);
        page.current = null;
      }
      state.anglePoints = [];
      clearCtx(previewCtx);
      updatePageIndicator();
      enforceBudget();
    }

    function switchBoardPage(index) {
      if (index < 0 || index >= state.boardPages.length || index === state.activeBoardPage) return;
      finishStroke(null);
      var old = state.boardPages[state.activeBoardPage];
      old.current = makeSnap();
      loadBoardPage(index);
    }

    $('btnAddBoardPage').addEventListener('click', function () {
      state.boardPages.push({ history: [], redoStack: [], current: null });
      switchBoardPage(state.boardPages.length - 1);
    });
    $('btnPrevBoardPage').addEventListener('click', function () { switchBoardPage(state.activeBoardPage - 1); });
    $('btnNextBoardPage').addEventListener('click', function () { switchBoardPage(state.activeBoardPage + 1); });
    $('btnDeleteBoardPage').addEventListener('click', function () {
      finishStroke(null);
      if (state.boardPages.length <= 1) {

        clearCtx(drawCtx);
        return;
      }
      var removed = state.boardPages.splice(state.activeBoardPage, 1)[0];
      removed.history.forEach(dropSnap);
      removed.redoStack.forEach(dropSnap);
      dropSnap(removed.current);
      loadBoardPage(Math.max(0, state.activeBoardPage - 1));

    // =====================================================================
    // 5) TUVAL BOYUTU
    //    - Yeniden boyutlandırma geciktirildi (mobil adres çubuğu sürekli tetikliyordu)
    //    - Tuval sadece büyür; tablet döndürülünce çizim kırpılıp kaybolmaz
    //    - 4K tahtalarda piksel sınırı ile bellek patlaması önlenir
    // =====================================================================
    function computeScale(w, h) {
      var base = Math.min(window.devicePixelRatio || 1, 2);
      var sw = (window.screen && screen.width) || w, sh = (window.screen && screen.height) || h;
      var area = Math.max(sw * sh, w * h) * base * base;
      var s = base;
      if (area > PIX_BUDGET) s = base * Math.sqrt(PIX_BUDGET / area);
      return Math.max(0.5, Math.round(s * 100) / 100);
    }

    function resizeCanvases() {
      var w = workspace.clientWidth, h = workspace.clientHeight;
      if (!w || !h) return;
      if (!scaleFixed) { S = computeScale(w, h); scaleFixed = true; }

      growCanvas(w, h);
      if (state.pdfDoc && (w !== lastPdfW || h !== lastPdfH)) layoutPdf();
    }

    // Çizim tuvalini (gerekirse) büyütür; içerik korunur. PDF ekrandan uzunsa
    // tuval de PDF boyuna uzar, böylece sayfanın her yerine yazılabilir.
    var MAX_CANVAS_PIX = 14e6;
    function growCanvas(w, h) {
      var nw = Math.max(logicalW, Math.ceil(w)), nh = Math.max(logicalH, Math.ceil(h));
      if (nw * nh * S * S > MAX_CANVAS_PIX) nh = Math.max(logicalH, Math.floor(MAX_CANVAS_PIX / (S * S) / nw));
      if (nw !== logicalW || nh !== logicalH) {
        finishStroke(null);
        var temp = (logicalW > 0 && drawCanvas.width > 0) ? makeSnap() : null;
        logicalW = nw; logicalH = nh;
        [drawCanvas, previewCanvas].forEach(function (c) {
          c.width = Math.round(nw * S);
          c.height = Math.round(nh * S);
          c.style.width = nw + 'px';
          c.style.height = nh + 'px';
        });
        drawCtx.setTransform(S, 0, 0, S, 0, 0);
        previewCtx.setTransform(S, 0, 0, S, 0, 0);
        if (temp) { restoreCanvasState(temp); dropSnap(temp); }
      }
    }

    var resizeTimer = null;
    function scheduleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resizeCanvases, 150);
    }
    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', scheduleResize);

    // =====================================================================
    // 6) ÇİZİM MOTORU
    // =====================================================================
    var strokeRect = null;
    var lastX = 0, lastY = 0, midX = 0, midY = 0, lastPos = null;
    var strokeMoved = false, hlStroke = false;

    function getPos(e) {
      var r = strokeRect || drawCanvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function isShapeMode() {
      return state.selectedShape !== 'free' && state.currentTool !== 'eraser';
    }

      ctx.lineJoin = 'round';

      ctx.fillStyle = state.penColor;
      ctx.lineWidth = state.currentTool === 'eraser' ? state.penWidth * 6

        : state.penWidth;
    }

    function deactivateImages() {
      Array.prototype.forEach.call(imageLayer.querySelectorAll('.placed-image-container.active'), function (c) {
        c.classList.remove('active');
      });
    }

    function canvasPointerDown(e, forcedEdge) {

      }
      e.preventDefault();
      closeMenus(null);
      deactivateImages();

      strokeRect = drawCanvas.getBoundingClientRect();
      var pos = getPos(e);
      lastPos = pos;

      if (state.currentTool === 'hand') {
        state.activePointerId = e.pointerId;
        try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}

        state.panStart = { x: e.clientX, y: e.clientY };
        state.panDelta = { x: 0, y: 0 };

        return;
      }

      if (state.selectedShape === 'text') {
        openTextBox(e, pos);
        strokeRect = null;
        return;
      }

      if (state.selectedShape === 'angle') {
        state.anglePoints.push(pos);
        previewCtx.save();
        resetCtx(previewCtx);
        previewCtx.fillStyle = state.penColor;
        previewCtx.beginPath();
        previewCtx.arc(pos.x, pos.y, 5, 0, Math.PI * 2);
        previewCtx.fill();
        previewCtx.restore();
        if (state.anglePoints.length === 3) {
          clearCtx(previewCtx);
          saveCanvasState();
          drawThreePointAngle(state.anglePoints);
          state.anglePoints = [];
        }
        strokeRect = null;
        return;
      }

      state.activePointerId = e.pointerId;
      try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}
      saveCanvasState();
      state.isDrawing = true;
      strokeMoved = false;
      lastX = pos.x; lastY = pos.y;
      midX = pos.x; midY = pos.y;
      state.shapeStart = pos;

      // Cetvel / gönye ölçülü kenarına yakın başlanırsa: kenar boyunca düz çizgi
      var hit = forcedEdge || (canEdgeDraw() ? findEdge(pos, EDGE_OUTSIDE, 3) : null);
      if (hit) {
        state.edgeDraw = { edge: hit.edge, t0: hit.t, t1: hit.t };
        hlStroke = false;
        return;
      }
      hlStroke = !isShapeMode() && state.currentTool === 'highlighter';
      if (hlStroke) {
        // Fosforlu kalem önce önizleme katmanına çizilir; üst üste binen
        // parçaların koyu benekler oluşturması engellenir.
        clearCtx(previewCtx);
        previewCanvas.style.opacity = '0.35';
      }
    }
    drawCanvas.addEventListener('pointerdown', function (e) { canvasPointerDown(e, null); });

    drawCanvas.addEventListener('pointermove', function (e) {
      if (e.pointerId !== state.activePointerId) return;

      if (state.isPanning) {
        state.panDelta.x = e.clientX - state.panStart.x;
        state.panDelta.y = e.clientY - state.panStart.y;
        applyPan(state.pan.x + state.panDelta.x, state.pan.y + state.panDelta.y);
        return;
      }
      if (!state.isDrawing) return;

      if (state.edgeDraw) {
        var ed = state.edgeDraw;
        ed.t1 = edgeT(getPos(e), ed.edge);
        clearCtx(previewCtx);
        drawEdgeLine(previewCtx, ed.edge, ed.t0, ed.t1);
        return;
      }

      if (isShapeMode()) {
        var p = getPos(e);
        lastPos = p;
        clearCtx(previewCtx);
        drawShape(previewCtx, state.shapeStart, p);
        return;
      }

      // Serbest çizim (birleştirilmiş olaylarla daha pürüzsüz)
      var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
      if (!evs.length) evs = [e];
      var ctx = hlStroke ? previewCtx : drawCtx;
      setDrawingStyle(ctx);
      if (hlStroke) ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(midX, midY);
      for (var i = 0; i < evs.length; i++) {
        var q = getPos(evs[i]);
        var mx = (lastX + q.x) / 2, my = (lastY + q.y) / 2;
        ctx.quadraticCurveTo(lastX, lastY, mx, my);
        midX = mx; midY = my;
        lastX = q.x; lastY = q.y;
      }
      ctx.stroke();
      resetCtx(ctx);
      strokeMoved = true;
      lastPos = { x: lastX, y: lastY };
    });

    function resetPan() {
      state.pan.x = 0; state.pan.y = 0;
      applyPan(0, 0);
    }

    // Fare tekerleği / dokunmatik yüzey ile sayfayı yukarı-aşağı kaydır
    workspace.addEventListener('wheel', function (e) {
      if (state.isDrawing || (e.target.closest && e.target.closest('#topBar, #textInputBox, .tb-panel'))) return;
      e.preventDefault();
      var dy = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY;
      var dx = e.deltaMode === 1 ? e.deltaX * 32 : e.deltaX;
      if (e.shiftKey && !dx) { dx = dy; dy = 0; }
      var wh = workspace.clientHeight, ww = workspace.clientWidth;
      state.pan.y = clamp(state.pan.y - dy, Math.min(0, wh - logicalH), 0);
      state.pan.x = clamp(state.pan.x - dx, Math.min(0, ww - logicalW), 0);
      applyPan(state.pan.x, state.pan.y);
    }, { passive: false });

    function applyPan(x, y) {
      var t = 'translate(' + x + 'px, ' + y + 'px)';
      for (var i = 0; i < panLayers.length; i++) panLayers[i].style.transform = t;
    }

    function finishStroke(e) {
      if (state.activePointerId === null && !state.isDrawing && !state.isPanning) return;
      var pos = e ? getPos(e) : lastPos;

      if (state.isDrawing) {
        if (state.edgeDraw) {
          var ed = state.edgeDraw;
          if (e) ed.t1 = edgeT(getPos(e), ed.edge);
          clearCtx(previewCtx);
          if (Math.abs(ed.t1 - ed.t0) > 1) drawEdgeLine(drawCtx, ed.edge, ed.t0, ed.t1);
          else {                                   // sadece dokunuldu: boş geri-al adımını sil
            var pg = state.boardPages[state.activeBoardPage];
            dropSnap(pg.history.pop());
          }
        } else if (isShapeMode()) {
          clearCtx(previewCtx);
          if (pos && state.shapeStart) drawShape(drawCtx, state.shapeStart, pos);
        } else {
          var ctx = hlStroke ? previewCtx : drawCtx;
          setDrawingStyle(ctx);
          if (hlStroke) ctx.globalAlpha = 1;
          ctx.beginPath();
          if (!strokeMoved) {
            ctx.arc(lastX, lastY, ctx.lineWidth / 2, 0, Math.PI * 2);   // tek dokunuş = nokta
            ctx.fill();
          } else {
            ctx.moveTo(midX, midY);
            ctx.lineTo(lastX, lastY);
            ctx.stroke();
          }
          resetCtx(ctx);
          if (hlStroke) {
            identity(drawCtx, function () {
              drawCtx.globalAlpha = 0.35;
              drawCtx.drawImage(previewCanvas, 0, 0);
            });
            clearCtx(previewCtx);
            previewCanvas.style.opacity = '';
          }
        }
      }

      if (state.isPanning) {
        state.pan.x += state.panDelta.x;
        state.pan.y += state.panDelta.y;
        state.panDelta = { x: 0, y: 0 };
        applyPan(state.pan.x, state.pan.y);
      }

      var pid = state.activePointerId;
      state.isPanning = false;
      state.isDrawing = false;
      state.activePointerId = null;
      state.shapeStart = null;
      state.edgeDraw = null;
      strokeRect = null;
      hlStroke = false;
      drawCanvas.style.cursor = state.currentTool === 'hand' ? 'grab' : 'crosshair';
      if (pid !== null) { try { drawCanvas.releasePointerCapture(pid); } catch (_) {} }
    }

    function onPointerEnd(e) {
      if (e.pointerId === state.activePointerId) finishStroke(e.type === 'pointercancel' ? null : e);
    }
    window.addEventListener('pointerup', onPointerEnd);
    window.addEventListener('pointercancel', onPointerEnd);
    drawCanvas.addEventListener('lostpointercapture', function (e) {
      if (e.pointerId === state.activePointerId) finishStroke(null);
    });
    window.addEventListener('blur', function () { finishStroke(null); });

    function drawShape(ctx, start, current) {
      ctx.save();
      setDrawingStyle(ctx);
      ctx.beginPath();

      var dx = current.x - start.x;
      var dy = current.y - start.y;
      var length = Math.hypot(dx, dy) || 1;
      var ux = dx / length, uy = dy / length;
      var ext = Math.max(logicalW, logicalH) * 3;

      if (state.selectedShape === 'line') {
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(current.x, current.y);
      } else if (state.selectedShape === 'ray') {
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(start.x + ux * ext, start.y + uy * ext);
      } else if (state.selectedShape === 'lineInfinite') {
        ctx.moveTo(start.x - ux * ext, start.y - uy * ext);
        ctx.lineTo(start.x + ux * ext, start.y + uy * ext);
      } else if (state.selectedShape === 'arrow') {
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(current.x, current.y);
        var headlen = 16 + state.penWidth;
        var angle = Math.atan2(dy, dx);
        ctx.lineTo(current.x - headlen * Math.cos(angle - Math.PI / 6), current.y - headlen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(current.x, current.y);
        ctx.lineTo(current.x - headlen * Math.cos(angle + Math.PI / 6), current.y - headlen * Math.sin(angle + Math.PI / 6));
      } else if (state.selectedShape === 'circle') {
        ctx.arc(start.x, start.y, Math.hypot(dx, dy), 0, Math.PI * 2);
      } else if (state.selectedShape === 'rect') {
        ctx.rect(start.x, start.y, dx, dy);
      } else if (state.selectedShape === 'polygon') {
        var r = Math.hypot(dx, dy);
        var rot = Math.atan2(dy, dx) - Math.PI / 2;
        var n = clamp(state.polygonSides, 3, 30);
        for (var i = 0; i <= n; i++) {
          var a = rot + (i % n) * Math.PI * 2 / n;
          var px = start.x + r * Math.cos(a), py = start.y + r * Math.sin(a);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawThreePointAngle(pts) {
      if (pts.length !== 3) return;
      var p1 = pts[0], vertex = pts[1], p3 = pts[2];
      var rayLen = Math.max(logicalW, logicalH) * 3;
      var a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
      var a2 = Math.atan2(p3.y - vertex.y, p3.x - vertex.x);
      drawCtx.save();
      setDrawingStyle(drawCtx);
      drawCtx.beginPath();
      drawCtx.moveTo(vertex.x, vertex.y);
      drawCtx.lineTo(vertex.x + Math.cos(a1) * rayLen, vertex.y + Math.sin(a1) * rayLen);
      drawCtx.moveTo(vertex.x, vertex.y);
      drawCtx.lineTo(vertex.x + Math.cos(a2) * rayLen, vertex.y + Math.sin(a2) * rayLen);
      drawCtx.stroke();
      pts.forEach(function (p) {
        drawCtx.beginPath();
        drawCtx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        drawCtx.fill();
      });
      drawCtx.restore();
    }

    // =====================================================================
    // 7) METİN ARACI (eski kodda "Ekle", B ve I butonları hiç çalışmıyordu)
    // =====================================================================
    function openTextBox(e, pos) {
      var ws = workspace.getBoundingClientRect();
      state.pendingTextPos = pos;
      textInputBox.classList.remove('hidden');
      var bw = textInputBox.offsetWidth || 240, bh = textInputBox.offsetHeight || 110;
      textInputBox.style.left = clamp(e.clientX - ws.left, 4, Math.max(4, ws.width - bw - 4)) + 'px';
      textInputBox.style.top = clamp(e.clientY - ws.top, 4, Math.max(4, ws.height - bh - 70)) + 'px';
      setTimeout(function () { try { textContent.focus(); } catch (_) {} }, 50);
    }
    function closeTextBox() {
      textInputBox.classList.add('hidden');
      textContent.value = '';
      state.pendingTextPos = null;
      try { textContent.blur(); } catch (_) {}
    }
    function applyText() {
      var txt = textContent.value;
      var pos = state.pendingTextPos;
      if (txt.replace(/\s/g, '') && pos) {
        saveCanvasState();
        var size = clamp(parseInt(fontSizeInput.value, 10) || 24, 8, 200);
        drawCtx.save();
        resetCtx(drawCtx);
        drawCtx.fillStyle = state.penColor;
        drawCtx.font = (state.isItalic ? 'italic ' : '') + (state.isBold ? 'bold ' : '') + size + 'px system-ui, Ubuntu, "DejaVu Sans", sans-serif';
        drawCtx.textBaseline = 'top';
        txt.split('\n').forEach(function (line, i) {
          drawCtx.fillText(line, pos.x, pos.y + i * size * 1.25);
        });
        drawCtx.restore();
      }
      closeTextBox();
    }
    $('btnApplyText').addEventListener('click', applyText);
    $('btnBold').addEventListener('click', function () {

    $('btnClear').addEventListener('click', function () {

    // Dışa aktar menüsü <body>'ye taşınır: mobilde menü kaydırılmış (transform)

    // Mobil kenar çubuğu (eski kodda butonun hiç görevi yoktu)
    var sidebar = $('sidebar'), sidebarOverlay = $('sidebarOverlay');
    function setSidebar(open) {

    }
    $('sidebarTab').addEventListener('click', function () {
