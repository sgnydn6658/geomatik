<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelişmiş Etkileşimli Matematik ve Geometri Tahtası</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF CDN (PDF Dışa Aktarımı İçin) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background-color: #ffffff;
      color: #1e293b;
      touch-action: none; /* Akıllı tahta çoklu dokunma ve kaydırma çakışmalarını önler */
    }

    /* Tahta Arka Planı ve Izgaralar */
    .board-bg {
      background-color: #ffffff;
    }
    
    /* Kareli Izgara */
    .board-bg.grid-graph {
      background-image: 
        linear-gradient(to right, rgba(51, 65, 85, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(51, 65, 85, 0.12) 1px, transparent 1px);
      background-size: 25px 25px;
    }

    /* Noktalı Izgara */
    .board-bg.grid-dots {
      background-image: radial-gradient(rgba(51, 65, 85, 0.25) 1.5px, transparent 0);
      background-size: 24px 24px;
      background-position: -0.5px -0.5px;
    }

    /* İzometrik Izgara */
    .board-bg.grid-isometric {
      background-image: 
        radial-gradient(rgba(51, 65, 85, 0.25) 1px, transparent 0);
      background-size: 30px 51.96px;
    }

    /* Şeffaf Akrilik Cam Araçlar */
    .instrument {
      position: absolute;
      touch-action: none;
      transform-origin: 0 0;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
      cursor: grab;
      z-index: 30;
    }

    .instrument:active {
      cursor: grabbing;
    }

    .glass-acrylic {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1.5px solid rgba(100, 116, 139, 0.45);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.22), 0 5px 14px rgba(0, 0, 0, 0.10);
    }

    .geometry-icon {
      width: 22px; height: 22px; flex: 0 0 22px;
      stroke: currentColor; fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }

    #workspace { min-width: 0; min-height: 0; }

    #bottomPalette { max-width: calc(100vw - 280px); overflow-x: auto; scrollbar-width: thin; }
    @media (max-width: 900px) {
      #sidebar { width: 210px !important; flex: 0 0 210px; }
      #bottomPalette { left: calc(50% + 105px); max-width: calc(100vw - 235px); gap: 0.4rem; padding-left: 0.5rem; padding-right: 0.5rem; }
    }
    @media (max-width: 600px) {
      #sidebar { width: 190px !important; flex-basis: 190px; padding-left: 0.35rem; padding-right: 0.35rem; }
      #bottomPalette { left: 190px; transform: translateX(0); max-width: calc(100vw - 195px); bottom: 0.5rem; }
    }

    /* Yüklenen Görsel Element Stili */
    .placed-image-container {
      position: absolute;
      touch-action: none;
      z-index: 25;
      cursor: move;
      border: 2px dashed transparent;
      transition: border-color 0.2s;
    }

    .placed-image-container.active {
      border-color: #2563eb;
    }

    /* Tutamaçlar (Akıllı tahtada parmakla kolay tutulabilmesi için boyutu büyütüldü) */
    .handle {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      cursor: pointer;
      z-index: 60;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
      transition: transform 0.15s ease, background-color 0.15s;
    }
    
    .handle:hover {
      transform: scale(1.25);
    }

    .rotate-handle {
      background-color: #2563eb;
    }
    .rotate-handle:hover {
      background-color: #1d4ed8;
    }

    .resize-handle {
      background-color: #059669;
    }
    .resize-handle:hover {
      background-color: #047857;
    }

    .delete-handle {
      background-color: #dc2626;
    }
    .delete-handle:hover {
      background-color: #b91c1c;
    }

    /* Modern Pergel Özel Stil */
    #compassContainer {
      position: absolute;
      touch-action: none;
      z-index: 35;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,0.22));
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen w-screen flex text-slate-800 antialiased select-none overflow-hidden bg-white">

  <!-- 1. SOL DİKEY MENÜ PANELİ -->
  <aside id="sidebar" class="w-60 bg-slate-900/95 border-r border-slate-800 text-slate-100 z-40 flex flex-col justify-between py-3 px-2 group shrink-0 shadow-2xl backdrop-blur-md">
    
    <div class="flex flex-col gap-3 overflow-y-auto pr-1">
      <!-- Logo / Başlık -->
      <div class="flex items-center gap-3 px-2 py-1 text-indigo-400 font-bold border-b border-slate-800 pb-2.5">
        <i data-lucide="shapes" class="w-7 h-7 shrink-0 text-indigo-400"></i>
        <div class="min-w-0 overflow-hidden">
          <div class="text-sm whitespace-nowrap text-white font-bold tracking-wide">GEOMATİK</div>
          <div class="text-[9px] whitespace-nowrap text-slate-400 font-medium">Dijital Matematik Eğitimi</div>
        </div>
      </div>

      <!-- PDF & Görsel İçe Aktarma -->
      <div class="flex flex-col gap-1.5">
        <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase px-2 whitespace-nowrap">Dosya & Medya</span>
        
        <label class="flex items-center gap-3 p-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer transition shadow-md">
          <i data-lucide="file-up" class="w-5 h-5 shrink-0"></i>
          <span class="text-xs font-medium whitespace-nowrap">PDF Aç</span>
          <input type="file" id="pdfInput" accept="application/pdf" class="hidden">
        </label>

        <label class="flex items-center gap-3 p-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer transition shadow-md">
          <i data-lucide="image" class="w-5 h-5 shrink-0"></i>
          <span class="text-xs font-medium whitespace-nowrap">Resim Yükle</span>
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>

        <!-- PDF Kontrolleri -->
        <div id="pdfControls" class="flex flex-col gap-1.5 hidden bg-slate-800/80 p-2 rounded-xl border border-slate-700/60">
          <div class="flex items-center justify-between text-xs">
            <button id="prevPage" class="p-1 hover:bg-slate-700 rounded text-slate-300 transition" title="Önceki Sayfa">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <span class="font-mono text-[11px] text-slate-200 flex items-center gap-1">
              <input type="number" id="pageNum" value="1" min="1" class="w-8 bg-slate-900 border border-slate-700 text-center rounded text-white text-xs py-0.5">
              <span id="pageCount" class="text-slate-400">/ 0</span>
            </span>
            <button id="nextPage" class="p-1 hover:bg-slate-700 rounded text-slate-300 transition" title="Sonraki Sayfa">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="flex items-center justify-between pt-1 border-t border-slate-700/50 text-xs">
            <button id="zoomOut" class="p-1 hover:bg-slate-700 rounded text-slate-300 transition" title="Uzaklaştır"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
            <span id="zoomLevel" class="font-mono text-[10px] text-slate-400">100%</span>
            <button id="zoomIn" class="p-1 hover:bg-slate-700 rounded text-slate-300 transition" title="Yakınlaştır"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
          </div>
        </div>
      </div>

      <!-- Geometri Araçları -->
      <div class="flex flex-col gap-1 border-t border-slate-800 pt-2.5">
        <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase px-2 whitespace-nowrap">Geometri Araçları</span>

        <button id="btnRuler" class="tool-btn flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="geometry-icon text-amber-400" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M6 8v4M9 8v3M12 8v4M15 8v3M18 8v4"/></svg>
          <span class="text-xs font-medium whitespace-nowrap">Cetvel</span>
        </button>
        <button id="btnProtractor" class="tool-btn flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="geometry-icon text-sky-400" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19a9 9 0 0 1 18 0H3Z"/><path d="M6 16h.01M9 13h.01M12 12h.01M15 13h.01M18 16h.01"/><path d="M12 19v-7"/></svg>
          <span class="text-xs font-medium whitespace-nowrap">Açıölçer</span>
        </button>
        <button id="btnTriangle45" class="tool-btn flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="geometry-icon text-emerald-400" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4h16L4 20Z"/><path d="M4 16h4v4"/><path d="M8 16h8"/></svg>
          <span class="text-xs font-medium whitespace-nowrap">Gönye</span>
        </button>
        <button id="btnCompass" class="tool-btn flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="geometry-icon text-rose-400" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4" r="2"/><path d="M12 6v3M11 9 5 20M13 9l6 11M7 18h4M13 18h4"/><path d="M9 9h6"/></svg>
          <span class="text-xs font-medium whitespace-nowrap">Pergel</span>
        </button>
      </div>



    <!-- Alt İşlem ve Ekran/Dışa Aktar Butonları -->
    <div class="flex flex-col gap-1.5 border-t border-slate-800 pt-2.5">
      <div class="flex items-center justify-between gap-1">
        <button id="btnUndo" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-white transition flex-1 flex justify-center" title="Geri Al">
          <i data-lucide="undo" class="w-5 h-5"></i>
        </button>
        <button id="btnRedo" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-white transition flex-1 flex justify-center" title="İleri Al">
          <i data-lucide="redo" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Dışa Aktar (Export) Seçeneği -->
      <div class="relative group/export">
        <button id="btnExport" class="w-full flex items-center gap-3 p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
          <i data-lucide="download" class="w-5 h-5 shrink-0 text-cyan-400"></i>
          <span class="text-xs font-medium whitespace-nowrap">Dışa Aktar</span>
        </button>
        <div class="absolute bottom-0 left-full ml-2 hidden group-hover/export:flex flex-col bg-slate-800 border border-slate-700 rounded-xl p-1 shadow-xl z-50 w-36 gap-1">
          <button id="exportPNG" class="p-2 text-left text-xs hover:bg-slate-700 text-slate-200 rounded-lg flex items-center gap-2">
            <i data-lucide="image" class="w-4 h-4 text-emerald-400"></i> PNG Görsel
          </button>
          <button id="exportPDF" class="p-2 text-left text-xs hover:bg-slate-700 text-slate-200 rounded-lg flex items-center gap-2">
            <i data-lucide="file-text" class="w-4 h-4 text-rose-400"></i> PDF Belgesi
          </button>
        </div>
      </div>

      <button id="btnFullscreen" class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
        <i data-lucide="maximize" class="w-5 h-5 shrink-0 text-amber-400"></i>
        <span class="text-xs font-medium whitespace-nowrap">Tam Ekran</span>
      </button>

      <button id="btnClear" class="flex items-center gap-3 p-2.5 bg-rose-900/40 hover:bg-rose-800/60 text-rose-200 border border-rose-700/60 rounded-xl transition">
        <i data-lucide="trash-2" class="w-5 h-5 shrink-0"></i>
        <span class="text-xs font-semibold whitespace-nowrap">Tahtayı Temizle</span>
      </button>
    </div>
  </aside>

  <!-- 2. ANA ÇALIŞMA ALANI -->
  <main id="workspace" class="relative flex-1 board-bg bg-white overflow-hidden">
    <!-- Sağ üst hızlı arka plan seçimi -->
    <div id="backgroundPicker" class="absolute top-3 right-3 z-[70]">
      <button id="btnBackgroundPicker" type="button" class="flex items-center gap-2 rounded-xl border border-slate-300/80 bg-white/95 px-3 py-2 text-xs font-semibold text-slate-700 shadow-lg backdrop-blur hover:bg-white" aria-expanded="false" title="Tahta arka planını değiştir">
        <i data-lucide="palette" class="w-4 h-4 text-indigo-600"></i><span>Arka Plan</span><i data-lucide="chevron-down" class="w-3 h-3"></i>
      </button>
      <div id="backgroundPickerMenu" class="hidden mt-2 w-48 rounded-xl border border-slate-200 bg-white/95 p-2 shadow-xl backdrop-blur">
        <div class="px-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-500">Tahta görünümü</div>
        <button type="button" data-board-bg="none" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-xs text-slate-700 hover:bg-indigo-50"><span class="h-4 w-4 rounded border border-slate-300 bg-white"></span>Düz beyaz</button>
        <button type="button" data-board-bg="graph" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-xs text-slate-700 hover:bg-indigo-50"><span class="h-4 w-4 rounded border border-slate-300" style="background-image:linear-gradient(#cbd5e1 1px,transparent 1px),linear-gradient(90deg,#cbd5e1 1px,transparent 1px);background-size:5px 5px"></span>Kareli</button>
        <button type="button" data-board-bg="dots" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-xs text-slate-700 hover:bg-indigo-50"><span class="h-4 w-4 rounded border border-slate-300" style="background-image:radial-gradient(#64748b 1px,transparent 1px);background-size:5px 5px"></span>Noktalı</button>
        <button type="button" data-board-bg="isometric" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-xs text-slate-700 hover:bg-indigo-50"><span class="h-4 w-4 rounded border border-slate-300" style="background-color:#f8fafc;background-image:repeating-linear-gradient(30deg,transparent 0 4px,#cbd5e1 4px 5px),repeating-linear-gradient(150deg,transparent 0 4px,#cbd5e1 4px 5px)"></span>İzometrik</button>
        <button type="button" data-board-bg="dark" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-xs text-slate-700 hover:bg-indigo-50"><span class="h-4 w-4 rounded border border-slate-500 bg-slate-800"></span>Koyu tahta</button>
        <button type="button" data-board-bg="blue" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-2 text-left text-xs text-slate-700 hover:bg-indigo-50"><span class="h-4 w-4 rounded border border-slate-300 bg-sky-50"></span>Açık mavi</button>
      </div>
    </div>
    <!-- Çizim Modu ve Şekiller -->
    <div id="shapeMenu" class="absolute top-[58px] right-3 z-[70] w-48 rounded-xl border border-slate-200 bg-white/95 p-2 shadow-xl backdrop-blur transition-[top] duration-150">
      <div class="px-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-500">Çizim Modu / Şekil</div>
      <select id="shapeSelect" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg p-2 focus:outline-none w-full cursor-pointer">
        <option value="free">✏️ Serbest Çizim</option>
        <option value="text">🔤 Metin / Yazı</option>
        <option value="line">📏 Düz Çizgi</option>
        <option value="arrow">➔ Ok İşareti</option>
        <option value="circle">⭕ Daire / Çember</option>
        <option value="rect">🔲 Dikdörtgen</option>
        <option value="triangle">🔺 Üçgen</option>
      </select>
    </div>

    <!-- PDF Canvas Katmanı -->
    <canvas id="pdfCanvas" class="absolute top-0 left-0 pointer-events-none z-0"></canvas>
    
    <!-- Çizim Canvas Katmanı -->
    <canvas id="drawCanvas" class="absolute top-0 left-0 z-10 cursor-crosshair"></canvas>

    <!-- Yüklenen Görseller Katmanı -->
    <div id="imageLayer" class="absolute inset-0 pointer-events-none z-20"></div>

    <!-- Metin Giriş Kutusu (Dinamik Açılır) -->
    <div id="textInputBox" class="absolute hidden z-50 bg-slate-900/90 border border-slate-700 p-2 rounded-xl shadow-2xl backdrop-blur-md flex flex-col gap-2">
      <div class="flex items-center gap-2 border-b border-slate-700 pb-1">
        <input type="number" id="fontSizeInput" value="24" min="12" max="120" class="w-14 bg-slate-800 border border-slate-600 rounded px-1.5 py-0.5 text-xs text-white">
        <button id="btnBold" class="p-1 rounded bg-slate-800 text-white font-bold text-xs hover:bg-slate-700 w-6 h-6 flex items-center justify-center">B</button>
        <button id="btnItalic" class="p-1 rounded bg-slate-800 text-white italic text-xs hover:bg-slate-700 w-6 h-6 flex items-center justify-center">I</button>
        <button id="btnApplyText" class="p-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs rounded px-2 ml-auto">Ekle</button>
      </div>
      <textarea id="textContent" placeholder="Metninizi yazın..." class="bg-slate-800 text-white text-sm p-2 rounded border border-slate-700 focus:outline-none resize-none" rows="2" cols="25"></textarea>
    </div>

    <!-- 3. GEOMETRİ ARAÇLARI KATMANI -->
    <div id="instrumentsLayer" class="absolute inset-0 z-30 pointer-events-none">
      
      <!-- CETVEL -->
      <div id="ruler" class="instrument glass-acrylic rounded-md hidden pointer-events-auto" style="width: 480px; height: 80px; top: 0; left: 0; transform-origin: center center;">
        <canvas id="rulerCanvas" class="w-full h-full"></canvas>
        <div class="handle rotate-handle -top-3.5 -right-3.5" data-action="rotate" title="Döndür"></div>
        <div class="handle resize-handle -bottom-3.5 -right-3.5" data-action="resize" title="Uzunluğu Ayarla"></div>
      </div>

      <!-- İLETKİ / AÇIÖLÇER -->
      <div id="protractor" class="instrument glass-acrylic rounded-t-full hidden pointer-events-auto" style="touch-action:none; user-select:none;" style="width: 380px; height: 190px; top: 180px; left: 240px;">
        <canvas id="protractorCanvas" class="w-full h-full"></canvas>
        <div id="protractorResizeHandleLeft" class="handle resize-handle" style="left: -21px; bottom: -21px; width:42px; height:42px; background:#22c55e; border:3px solid white; box-shadow:0 2px 8px rgba(0,0,0,.35); touch-action:none;" title="Boyutlandır ve Döndür (180° Noktası)"></div>
        <div id="protractorResizeHandle" class="handle resize-handle" style="right: -21px; bottom: -21px; width:42px; height:42px; background:#22c55e; border:3px solid white; box-shadow:0 2px 8px rgba(0,0,0,.35); touch-action:none;" title="Boyutlandır ve Döndür (0° Noktası)"></div>
        <button id="btnToggle360" class="absolute bottom-2 left-3 bg-slate-900/80 text-white text-[10px] px-2 py-0.5 rounded border border-slate-600 hover:bg-slate-700 shadow-sm">180° / 360°</button>
      </div>

      <!-- 45-45-90 GÖNYE -->
      <div id="triangle45" class="instrument hidden pointer-events-auto" style="width: 290px; height: 290px; top: 0; left: 0; transform-origin: center center;">
        <canvas id="triangle45Canvas" class="w-full h-full"></canvas>
        <div class="handle rotate-handle" data-action="rotate" style="left: -14px; bottom: -14px;" title="Dik köşeden döndür"></div>
        <div class="handle resize-handle -bottom-3.5 -right-3.5" data-action="resize" title="Boyutlandır"></div>
      </div>

      <!-- MEKANİK PERGEL -->
      <div id="compassContainer" class="hidden pointer-events-auto">
        <svg id="compassSVG" width="360" height="500" viewBox="-180 -350 360 500" class="overflow-visible">
          <defs>
            <linearGradient id="simpleMetal" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#bfc2c9" />
              <stop offset="0.5" stop-color="#f4f4f6" />
              <stop offset="1" stop-color="#c9cbd1" />
            </linearGradient>
          </defs>

          <circle id="compassGuideCircle" cx="0" cy="0" r="100" stroke="#2563eb" stroke-dasharray="4,4" stroke-width="1.5" fill="none" opacity="0" />
          <line id="compassRadiusLine" x1="0" y1="0" x2="100" y2="0" stroke="#2563eb" stroke-dasharray="3,3" stroke-width="1.5" opacity="0" />
          <g id="compassInfoBadge" opacity="0" transform="translate(50, -18)">
            <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#0f172a" opacity="0.9" />
            <text id="compassRadiusText" x="0" y="4" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">5.0 cm</text>
          </g>

          <g id="compassBody" stroke-linejoin="round" stroke-linecap="round">
            <path id="legNeedle" d="M 60,-180 L 0,0" stroke="#d5d5da" stroke-width="12" fill="none" />
            <path id="needleHighlight" d="M 58,-168 L 2,-12" stroke="#eeeeF1" stroke-width="3" fill="none" />
            <path d="M -4,-2 L 0,14 L 4,-2 Z" fill="#34343e" />

            <path id="legPencil" d="M 60,-180 L 120,0" stroke="#d5d5da" stroke-width="12" fill="none" />

            <g id="topRotationHandle" class="cursor-grab active:cursor-grabbing">

            <g id="radiusHandle" class="cursor-ew-resize" opacity="0">
              <circle id="radiusHandleCircle" cx="120" cy="0" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
              <circle cx="120" cy="0" r="3" fill="#2563eb" />
            </g>
          </g>
        </svg>
      </div>

    </div>
  </main>

  <!-- 4. ALT ORTADA YÜZEN KALEM, RENK VE SAYFA PANELİ -->
  <div id="bottomPalette" class="fixed bottom-3 left-[calc(50%+120px)] -translate-x-1/2 bg-slate-900/90 text-white border border-slate-700/80 rounded-xl px-2.5 py-1.5 flex items-center gap-2 z-50 shadow-2xl backdrop-blur-lg">
    
    <!-- Sayfa Yönetimi -->
    <div class="flex items-center gap-1 bg-slate-800/90 px-1.5 py-0.5 rounded-lg border border-slate-700/60">
      <button id="btnPrevBoardPage" class="p-1 hover:bg-slate-700 rounded text-slate-300 transition" title="Önceki Tahta Sayfası">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>
      <span id="boardPageIndicator" class="text-xs font-mono px-1">1/1</span>
      <button id="btnNextBoardPage" class="p-1 hover:bg-slate-700 rounded text-slate-300 transition" title="Sonraki Tahta Sayfası">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
      <button id="btnAddBoardPage" class="p-1 bg-indigo-600 hover:bg-indigo-500 rounded text-white transition ml-1" title="Yeni Sayfa Ekle">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
      </button>
      <button id="btnDeleteBoardPage" class="p-1 hover:bg-rose-900/60 text-rose-400 rounded transition" title="Sayfayı Sil">
        <i data-lucide="trash" class="w-3.5 h-3.5"></i>

    <div class="h-6 w-px bg-slate-700"></div>

    <!-- Çizim Modları (Kalem, Fosforlu, Silgi) -->
    <div class="flex items-center gap-1 bg-slate-800/90 p-1 rounded-xl border border-slate-700/60">

        <i data-lucide="hand" class="w-4 h-4"></i>
        <span>Ekranı Tut</span>

        <i data-lucide="eraser" class="w-4 h-4"></i>
        <span>Silgi</span>
      </button>

    <div class="h-6 w-px bg-slate-700"></div>

    <!-- Renk Paleti -->
    <div class="flex items-center gap-1.5">
      <button data-color="#000000" class="color-preset w-6 h-6 rounded-full bg-black ring-2 ring-indigo-500 scale-110 transition shadow-sm"></button>
      <button data-color="#dc2626" class="color-preset w-6 h-6 rounded-full bg-red-600 ring-2 ring-transparent hover:scale-110 transition shadow-sm"></button>
      <button data-color="#2563eb" class="color-preset w-6 h-6 rounded-full bg-blue-600 ring-2 ring-transparent hover:scale-110 transition shadow-sm"></button>
      <button data-color="#16a34a" class="color-preset w-6 h-6 rounded-full bg-green-600 ring-2 ring-transparent hover:scale-110 transition shadow-sm"></button>
      <button data-color="#ca8a04" class="color-preset w-6 h-6 rounded-full bg-yellow-600 ring-2 ring-transparent hover:scale-110 transition shadow-sm"></button>
      <button data-color="#ea580c" class="color-preset w-6 h-6 rounded-full bg-orange-600 ring-2 ring-transparent hover:scale-110 transition shadow-sm"></button>
      <button data-color="#9333ea" class="color-preset w-6 h-6 rounded-full bg-purple-600 ring-2 ring-transparent hover:scale-110 transition shadow-sm"></button>
      <button data-color="#db2777" class="color-preset w-6 h-6 rounded-full bg-pink-600 ring-2 ring-transparent hover:scale-110 transition shadow-sm"></button>
      <button data-color="#ffffff" class="color-preset w-6 h-6 rounded-full bg-white border border-slate-400 ring-2 ring-transparent hover:scale-110 transition shadow-sm" title="Beyaz"></button>

      <!-- Özel Renk Seçici -->
      <div class="relative flex items-center justify-center w-7 h-7 rounded-full overflow-hidden border border-slate-600 cursor-pointer hover:scale-110 transition ml-1" title="Özel Renk Seç">
        <input type="color" id="penColor" value="#000000" class="absolute -top-2 -left-2 w-12 h-12 cursor-pointer bg-transparent border-0">
      </div>
    </div>

    <div class="h-6 w-px bg-slate-700"></div>

    <!-- Kalem Kalınlık Slider -->
    <div class="flex items-center gap-2">
      <i data-lucide="circle-dot" class="w-4 h-4 text-slate-400"></i>
      <input type="range" id="penWidth" min="1" max="50" value="4" class="w-24 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
      <span id="widthValue" class="text-xs font-mono text-slate-300 w-5 text-center">4</span>
    </div>

  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Uygulama Durumu
    const state = {
      pdfDoc: null,
      pageNum: 1,
      zoomScale: 1.0,

      // Çoklu Sayfa Yönetimi
      activeBoardPage: 0,
      boardPages: [
        { history: [], redoStack: [], imageElements: [] }
      ],
      
      // Çizim Motoru
      isDrawing: false,
      activePointerId: null, // Akıllı tahta çoklu dokunma kilitlenmesini önler
      currentTool: 'pen',
      isPanning: false,
      panStart: null,
      panOffsets: { pdfCanvas: [0, 0], drawCanvas: [0, 0], imageLayer: [0, 0], instrumentsLayer: [0, 0] },
      selectedShape: 'free',
      penColor: '#000000',
      penWidth: 4, // Akıllı tahtada parmakla daha rahat görünmesi için varsayılan 4 yapıldı
      
      // Metin Ayarları
      isBold: false,
      isItalic: false,
      pendingTextPos: null,

      // Geçmiş Limit
      maxHistory: 30,
      shapeStart: null,

      // Geometri Araçları
      instruments: {
        ruler: { x: 160, y: 100, angle: 0, width: 480, visible: false },
        protractor: { x: 400, y: 300, angle: 0, radius: 190, mode360: false, visible: false },
        triangle45: { x: 340, y: 140, angle: 0, visible: false },
      },

      // Pergel Durumu
      compass: {
        x: 400,
        y: 300,
        radius: 150,
        angle: 0,
        visible: false
      }
    };

    // DOM Bağlantıları
    const workspace = document.getElementById('workspace');
    const pdfCanvas = document.getElementById('pdfCanvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');
    const imageLayer = document.getElementById('imageLayer');

    // Geçmiş Kaydı ve Geri/İleri Alma
    function saveCanvasState() {
      const page = state.boardPages[state.activeBoardPage];
      if (page.history.length >= state.maxHistory) page.history.shift();
      page.history.push(drawCanvas.toDataURL());
      page.redoStack = [];
    }

    function restoreCanvasState(dataUrl) {
      const img = new Image();
      img.src = dataUrl;
      img.onload = () => {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        drawCtx.drawImage(img, 0, 0);
      };
    }

    document.getElementById('btnUndo').addEventListener('click', () => {
      const page = state.boardPages[state.activeBoardPage];
      if (page.history.length > 0) {
        page.redoStack.push(drawCanvas.toDataURL());
        const previousState = page.history.pop();
        restoreCanvasState(previousState);
      }
    });

    document.getElementById('btnRedo').addEventListener('click', () => {
      const page = state.boardPages[state.activeBoardPage];
      if (page.redoStack.length > 0) {
        page.history.push(drawCanvas.toDataURL());
        const nextState = page.redoStack.pop();
        restoreCanvasState(nextState);
      }
    });

    // 1. Çoklu Sayfa Yönetimi Fonksiyonları
    function updatePageIndicator() {
      document.getElementById('boardPageIndicator').textContent = `${state.activeBoardPage + 1}/${state.boardPages.length}`;
    }

    function switchBoardPage(index) {
      if (index < 0 || index >= state.boardPages.length) return;
      state.activeBoardPage = index;
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      
      const page = state.boardPages[state.activeBoardPage];
      if (page.history.length > 0) {
        restoreCanvasState(page.history[page.history.length - 1]);
      }
      updatePageIndicator();
    }

    document.getElementById('btnAddBoardPage').addEventListener('click', () => {
      state.boardPages.push({ history: [], redoStack: [], imageElements: [] });
      switchBoardPage(state.boardPages.length - 1);
    });

    document.getElementById('btnPrevBoardPage').addEventListener('click', () => {
      switchBoardPage(state.activeBoardPage - 1);
    });

    document.getElementById('btnNextBoardPage').addEventListener('click', () => {
      switchBoardPage(state.activeBoardPage + 1);
    });

    document.getElementById('btnDeleteBoardPage').addEventListener('click', () => {
      if (state.boardPages.length <= 1) {
        saveCanvasState();
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        return;
      }
      state.boardPages.splice(state.activeBoardPage, 1);
      const newIndex = Math.max(0, state.activeBoardPage - 1);
      switchBoardPage(newIndex);
    });

    // Tuval Yeniden Boyutlandırma
    let canvasLogicalSize = null;

    function resizeCanvases() {
      const w = workspace.clientWidth;
      const h = workspace.clientHeight;
      if (!w || !h) return;

      // Çizim tuvalinin gerçek çözünürlüğünü sabit tut; ekranda orantılı ölçekle.
      if (!canvasLogicalSize) {
        canvasLogicalSize = { w, h };
        drawCanvas.width = w;
        drawCanvas.height = h;
      }

      const scale = Math.min(w / canvasLogicalSize.w, h / canvasLogicalSize.h);
      const displayW = canvasLogicalSize.w * scale;
      const displayH = canvasLogicalSize.h * scale;
      drawCanvas.style.width = `${displayW}px`;
      drawCanvas.style.height = `${displayH}px`;
      drawCanvas.style.left = `${(w - displayW) / 2}px`;
      drawCanvas.style.top = `${(h - displayH) / 2}px`;

      if (state.pdfDoc) renderPdfPage(state.pageNum);
      renderRulerGraphics();
      renderProtractorGraphics();
      updateProtractorTransform();
      renderTriangle45Graphics();
      updateCompassTransform();
    }
    window.addEventListener('resize', resizeCanvases);
    lucide.createIcons();

    // PDF Yükleme
    const pdfInput = document.getElementById('pdfInput');
    const pdfControls = document.getElementById('pdfControls');
    const pageNumInput = document.getElementById('pageNum');
    const pageCountSpan = document.getElementById('pageCount');

    pdfInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        const fileReader = new FileReader();
        fileReader.onload = function() {
          const typedarray = new Uint8Array(this.result);
          pdfjsLib.getDocument(typedarray).promise.then((pdf) => {
            state.pdfDoc = pdf;
            pageCountSpan.textContent = `/ ${pdf.numPages}`;
            pdfControls.classList.remove('hidden');
            state.pageNum = 1;
            pageNumInput.value = 1;
            renderPdfPage(1);
          });
        };
        fileReader.readAsArrayBuffer(file);
      }
    });

    function renderPdfPage(num) {
      state.pdfDoc.getPage(num).then((page) => {
        const unscaledViewport = page.getViewport({ scale: 1 });
        const baseScale = Math.min(workspace.clientWidth / unscaledViewport.width, workspace.clientHeight / unscaledViewport.height) * 0.95;
        const finalScale = baseScale * state.zoomScale;
        const viewport = page.getViewport({ scale: finalScale });

        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;

        pdfCanvas.style.left = `${(workspace.clientWidth - viewport.width) / 2}px`;
        pdfCanvas.style.top = `${(workspace.clientHeight - viewport.height) / 2}px`;

        page.render({ canvasContext: pdfCtx, viewport: viewport });
        document.getElementById('zoomLevel').textContent = `${Math.round(state.zoomScale * 100)}%`;
      });
    }

    document.getElementById('prevPage').addEventListener('click', () => {
      if (state.pageNum <= 1) return;
      state.pageNum--;
      pageNumInput.value = state.pageNum;
      renderPdfPage(state.pageNum);
    });

    document.getElementById('nextPage').addEventListener('click', () => {
      if (!state.pdfDoc || state.pageNum >= state.pdfDoc.numPages) return;
      state.pageNum++;
      pageNumInput.value = state.pageNum;
      renderPdfPage(state.pageNum);
    });

    pageNumInput.addEventListener('change', (e) => {
      let val = parseInt(e.target.value);
      if (state.pdfDoc && val >= 1 && val <= state.pdfDoc.numPages) {
        state.pageNum = val;
        renderPdfPage(val);
      }
    });

    document.getElementById('zoomIn').addEventListener('click', () => {
      if (state.zoomScale < 3.0) {
        state.zoomScale += 0.15;
        renderPdfPage(state.pageNum);
      }
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      if (state.zoomScale > 0.5) {
        state.zoomScale -= 0.15;
        renderPdfPage(state.pageNum);
      }
    });

    // 2. Resim Yükleme ve Etkileşim
    const imageInput = document.getElementById('imageInput');
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          createInteractiveImage(evt.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    function createInteractiveImage(src) {
      const container = document.createElement('div');
      container.className = 'placed-image-container pointer-events-auto active';
      container.style.left = '200px';
      container.style.top = '150px';
      container.style.width = '250px';

      const img = document.createElement('img');
      img.src = src;
      img.className = 'w-full h-auto pointer-events-none select-none rounded shadow-md';
      
      const rotateHandle = document.createElement('div');
      rotateHandle.className = 'handle rotate-handle -top-3.5 -right-3.5';
      rotateHandle.title = 'Döndür';

      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'handle resize-handle -bottom-3.5 -right-3.5';
      resizeHandle.title = 'Boyutlandır';

      const deleteHandle = document.createElement('div');
      deleteHandle.className = 'handle delete-handle -top-3.5 -left-3.5';
      deleteHandle.title = 'Sil';

      container.appendChild(img);
      container.appendChild(rotateHandle);
      container.appendChild(resizeHandle);
      container.appendChild(deleteHandle);
      imageLayer.appendChild(container);

      let isDragging = false, isRotating = false, isResizing = false;
      let startX, startY, startWidth, currentAngle = 0;

      deleteHandle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        container.remove();
      });

      container.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (e.target === rotateHandle) {
          isRotating = true;
        } else if (e.target === resizeHandle) {
          isResizing = true;
          startWidth = container.offsetWidth;
        } else {
          isDragging = true;
        }
        startX = e.clientX;
        startY = e.clientY;
        container.setPointerCapture(e.pointerId);
      });

      container.addEventListener('pointermove', (e) => {
        if (isDragging) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          container.style.left = `${container.offsetLeft + dx}px`;
          container.style.top = `${container.offsetTop + dy}px`;
          startX = e.clientX;
          startY = e.clientY;
        } else if (isRotating) {
          const rect = container.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const rad = Math.atan2(e.clientY - cy, e.clientX - cx);
          currentAngle = rad * (180 / Math.PI);
          container.style.transform = `rotate(${currentAngle}deg)`;
        } else if (isResizing) {
          const dx = e.clientX - startX;
          container.style.width = `${Math.max(80, startWidth + dx)}px`;
        }
      });

      container.addEventListener('pointerup', (e) => {
        isDragging = isRotating = isResizing = false;
        try { container.releasePointerCapture(e.pointerId); } catch(err){}
      });
    }

    // 3. Metin (Text) Ekleyici Kurulumu
    const textInputBox = document.getElementById('textInputBox');
    const textContent = document.getElementById('textContent');
    const fontSizeInput = document.getElementById('fontSizeInput');
    const btnBold = document.getElementById('btnBold');
    const btnItalic = document.getElementById('btnItalic');
    const btnApplyText = document.getElementById('btnApplyText');

    btnBold.addEventListener('click', () => {
      state.isBold = !state.isBold;
      btnBold.classList.toggle('bg-indigo-600', state.isBold);
    });

    btnItalic.addEventListener('click', () => {
      state.isItalic = !state.isItalic;
      btnItalic.classList.toggle('bg-indigo-600', state.isItalic);
    });

    btnApplyText.addEventListener('click', () => {
      if (!state.pendingTextPos || !textContent.value.trim()) {
        textInputBox.classList.add('hidden');
        return;
      }
      saveCanvasState();
      drawCtx.font = `${state.isItalic ? 'italic ' : ''}${state.isBold ? 'bold ' : ''}${fontSizeInput.value}px Inter, sans-serif`;
      drawCtx.fillStyle = state.penColor;
      
      const lines = textContent.value.split('\n');
      const lineHeight = parseInt(fontSizeInput.value) * 1.2;
      lines.forEach((line, i) => {
        drawCtx.fillText(line, state.pendingTextPos.x, state.pendingTextPos.y + (i * lineHeight));
      });

      textContent.value = '';
      textInputBox.classList.add('hidden');
    });

    // Çizim Motoru (Pointer Events ile Akıllı Tahta Uyumlu)
    let lastX = 0, lastY = 0;
    let snapshot = null;

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const scaleX = drawCanvas.width / rect.width || 1;
      const scaleY = drawCanvas.height / rect.height || 1;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      if (state.activePointerId !== null) return; // Başka parmak çizim yapıyorsa engelle
      state.activePointerId = e.pointerId;
      drawCanvas.setPointerCapture(e.pointerId);

      let pos = getPos(e);

      if (state.currentTool === 'hand') {
        state.isPanning = true;
        state.panStart = { x: e.clientX, y: e.clientY };
        drawCanvas.style.cursor = 'grabbing';
        e.preventDefault();
        return;
      }

      if (state.selectedShape === 'text') {
        state.pendingTextPos = pos;
        textInputBox.style.left = `${pos.x}px`;
        textInputBox.style.top = `${pos.y}px`;
        textInputBox.classList.remove('hidden');
        textContent.focus();
        return;
      } else {
        textInputBox.classList.add('hidden');
      }

      saveCanvasState();
      state.isDrawing = true;
      lastX = pos.x;
      lastY = pos.y;
      state.shapeStart = pos;

      snapshot = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (state.isPanning && e.pointerId === state.activePointerId) {
        const dx = e.clientX - state.panStart.x;
        const dy = e.clientY - state.panStart.y;
        ['pdfCanvas', 'drawCanvas', 'imageLayer', 'instrumentsLayer'].forEach(id => {
          const layer = document.getElementById(id);
          const [baseX, baseY] = state.panOffsets[id];
          layer.style.transform = `translate(${baseX + dx}px, ${baseY + dy}px)`;
        });
        return;
      }
      if (!state.isDrawing || e.pointerId !== state.activePointerId) return;
      let pos = getPos(e);

      if (state.selectedShape !== 'free' && state.selectedShape !== 'text' && state.currentTool !== 'eraser') {
        drawCtx.putImageData(snapshot, 0, 0);
        drawShapePreview(state.shapeStart, pos);
      } else if (state.selectedShape === 'free') {
        drawCtx.beginPath();
        drawCtx.moveTo(lastX, lastY);
        drawCtx.lineTo(pos.x, pos.y);

        if (state.currentTool === 'pen') {
          drawCtx.globalCompositeOperation = 'source-over';
          drawCtx.strokeStyle = state.penColor;
          drawCtx.lineWidth = state.penWidth;
          drawCtx.globalAlpha = 1.0;
        } else if (state.currentTool === 'highlighter') {
          drawCtx.globalCompositeOperation = 'source-over';
          drawCtx.strokeStyle = state.penColor;
          drawCtx.lineWidth = state.penWidth * 4;
          drawCtx.globalAlpha = 0.35;
        } else if (state.currentTool === 'eraser') {
          drawCtx.globalCompositeOperation = 'destination-out';
          drawCtx.lineWidth = state.penWidth * 6;
          drawCtx.globalAlpha = 1.0;
        }
        
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.stroke();
        drawCtx.globalAlpha = 1.0;
        lastX = pos.x;
        lastY = pos.y;
      }
    });

    function drawShapePreview(start, current) {
      drawCtx.beginPath();
      drawCtx.strokeStyle = state.penColor;
      drawCtx.lineWidth = state.penWidth;
      drawCtx.globalAlpha = state.currentTool === 'highlighter' ? 0.35 : 1.0;
      drawCtx.globalCompositeOperation = 'source-over';

      const dx = current.x - start.x;
      const dy = current.y - start.y;

      if (state.selectedShape === 'line') {
        drawCtx.moveTo(start.x, start.y);
        drawCtx.lineTo(current.x, current.y);
      } else if (state.selectedShape === 'arrow') {
        drawCtx.moveTo(start.x, start.y);
        drawCtx.lineTo(current.x, current.y);
        const headlen = 14;
        const angle = Math.atan2(dy, dx);
        drawCtx.lineTo(current.x - headlen * Math.cos(angle - Math.PI / 6), current.y - headlen * Math.sin(angle - Math.PI / 6));
        drawCtx.moveTo(current.x, current.y);
        drawCtx.lineTo(current.x - headlen * Math.cos(angle + Math.PI / 6), current.y - headlen * Math.sin(angle + Math.PI / 6));
      } else if (state.selectedShape === 'circle') {
        const radius = Math.hypot(dx, dy);
        drawCtx.arc(start.x, start.y, radius, 0, Math.PI * 2);
      } else if (state.selectedShape === 'rect') {
        drawCtx.rect(start.x, start.y, dx, dy);
      } else if (state.selectedShape === 'triangle') {
        drawCtx.moveTo(start.x + dx / 2, start.y);
        drawCtx.lineTo(start.x, start.y + dy);
        drawCtx.lineTo(start.x + dx, start.y + dy);
        drawCtx.closePath();
      }
      drawCtx.stroke();
      drawCtx.globalAlpha = 1.0;
    }

    function endDrawing(e) {
      if (e.pointerId === state.activePointerId) {
        if (state.isPanning && state.panStart) {
          const dx = e.clientX - state.panStart.x;
          const dy = e.clientY - state.panStart.y;
          ['pdfCanvas', 'drawCanvas', 'imageLayer', 'instrumentsLayer'].forEach(id => {
            state.panOffsets[id][0] += dx;
            state.panOffsets[id][1] += dy;
          });
        }
        state.isPanning = false;
        state.panStart = null;
        state.isDrawing = false;
        state.activePointerId = null;
        drawCanvas.style.cursor = state.currentTool === 'hand' ? 'grab' : 'crosshair';
        try { drawCanvas.releasePointerCapture(e.pointerId); } catch(err){}
      }
    }

    // Geometri Çizimleri
    function renderRulerGraphics() {
      const c = document.getElementById('rulerCanvas');
      const r = state.instruments.ruler;
      c.width = r.width;
      c.height = 80;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

      ctx.strokeStyle = '#0f172a';
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 10px Inter';
      ctx.textAlign = 'center';

      const pxPerCm = 32;
      const totalCm = Math.floor(r.width / pxPerCm);

      for (let i = 0; i <= totalCm * 10; i++) {
        const x = i * (pxPerCm / 10);
        let tickLen = 8;

        if (i % 10 === 0) {
          tickLen = 24;
          const cmVal = i / 10;
          if (cmVal > 0) ctx.fillText(cmVal.toString(), x, 38);
        } else if (i % 5 === 0) {
          tickLen = 16;
        }

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, tickLen);
        ctx.stroke();
      }
    }

    function renderProtractorGraphics() {
      const c = document.getElementById('protractorCanvas');
      const prot = state.instruments.protractor;
      
      const r = prot.radius;
      const width = r * 2;
      const height = prot.mode360 ? r * 2 : r;
      
      c.width = width;
      c.height = height;
      const parentEl = document.getElementById('protractor');
      parentEl.style.width = `${width}px`;
      parentEl.style.height = `${height}px`;

      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

      const cx = r, cy = prot.mode360 ? r : r;

      ctx.beginPath();
      if (prot.mode360) {
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
      } else {
        ctx.arc(cx, cy, r, Math.PI, 0, false);
      }
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.45, prot.mode360 ? 0 : Math.PI, prot.mode360 ? Math.PI * 2 : 0, false);
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#dc2626';
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 9px Inter';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const maxDeg = prot.mode360 ? 360 : 180;

      for (let deg = 0; deg <= maxDeg; deg += 1) {
        const rad = (180 - deg) * Math.PI / 180;
        let tickLen = 6;

        if (deg % 10 === 0) tickLen = 16;
        else if (deg % 5 === 0) tickLen = 10;

        const x1 = cx + r * Math.cos(rad);
        const y1 = cy - r * Math.sin(rad);
        const x2 = cx + (r - tickLen) * Math.cos(rad);
        const y2 = cy - (r - tickLen) * Math.sin(rad);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        if (deg % 10 === 0 && deg < 360) {
          const textRad = (180 - deg) * Math.PI / 180;
          const tx = cx + (r - 26) * Math.cos(textRad);
          const ty = cy - (r - 26) * Math.sin(textRad);
          ctx.fillText(deg.toString(), tx, ty);
        }
      }
    }

    document.getElementById('btnToggle360').addEventListener('click', () => {
      state.instruments.protractor.mode360 = !state.instruments.protractor.mode360;
      renderProtractorGraphics();
    });

    function updateProtractorTransform() {
      const el = document.getElementById('protractor');
      const p = state.instruments.protractor;
      const cy = p.mode360 ? p.radius : p.radius;
      el.style.transform = `translate3d(${p.x - p.radius}px, ${p.y - cy}px, 0px) rotate(${p.angle}deg)`;
      el.style.transformOrigin = `${p.radius}px ${cy}px`;
    }

    // Açıölçer Etkileşimleri
    // Polypad tarzı: merkez pivot sabit, sağ uç pointer ile birebir hareket eder.
    const protractorEl = document.getElementById('protractor');
    const protractorResizeHandle = document.getElementById('protractorResizeHandle');
    const protractorResizeHandleLeft = document.getElementById('protractorResizeHandleLeft');
    let protractorGesture = null;

    function getBoardPoint(e) {
      const rect = workspace.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    const instrumentDrawing = { active: false, key: null, pointerId: null, last: null, edge: null };

    function isCanvasDrawingTool() {
      return state.currentTool === 'pen' || state.currentTool === 'highlighter' || state.currentTool === 'eraser';
    }

    function getInstrumentLocalPoint(e, inst, el) {
      const pt = getBoardPoint(e);
      const w = el.offsetWidth;
      const h = el.offsetHeight;
      const cx = inst.x + w / 2;
      const cy = inst.y + h / 2;
      const a = -inst.angle * Math.PI / 180;
      const dx = pt.x - cx;
      const dy = pt.y - cy;
      return {
        x: dx * Math.cos(a) - dy * Math.sin(a) + w / 2,
        y: dx * Math.sin(a) + dy * Math.cos(a) + h / 2,
        w, h
      };
    }

    function localToBoardPoint(local, inst, el) {
      const w = el.offsetWidth, h = el.offsetHeight;
      const a = inst.angle * Math.PI / 180;
      const dx = local.x - w / 2;
      const dy = local.y - h / 2;
      return {
        x: inst.x + w / 2 + dx * Math.cos(a) - dy * Math.sin(a),
        y: inst.y + h / 2 + dx * Math.sin(a) + dy * Math.cos(a)
      };
    }

    function constrainedInstrumentPoint(e, key, inst, el, edge) {
      const p = getInstrumentLocalPoint(e, inst, el);
      if (key === 'ruler') {
        return localToBoardPoint({ x: Math.max(0, Math.min(p.w, p.x)), y: 1 }, inst, el);
      }
      if (key === 'triangle45') {
        const leftEdge = 15 / 290 * p.w;
        const bottomEdge = 275 / 290 * p.h;
        if (edge === 'left') return localToBoardPoint({ x: leftEdge, y: Math.max(0, Math.min(bottomEdge, p.y)) }, inst, el);
        return localToBoardPoint({ x: Math.max(leftEdge, Math.min(p.w - 15 / 290 * p.w, p.x)), y: bottomEdge }, inst, el);
      }
      return getBoardPoint(e);
    }

    function drawInstrumentSegment(from, to) {
      drawCtx.save();
      drawCtx.beginPath();
      drawCtx.moveTo(from.x, from.y);
      drawCtx.lineTo(to.x, to.y);
      drawCtx.globalCompositeOperation = state.currentTool === 'eraser' ? 'destination-out' : 'source-over';
      drawCtx.strokeStyle = state.penColor;
      drawCtx.lineWidth = state.currentTool === 'eraser' ? state.penWidth * 6 : state.penWidth;
      drawCtx.globalAlpha = state.currentTool === 'highlighter' ? 0.35 : 1;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.stroke();
      drawCtx.restore();
    }

    function beginInstrumentDrawing(e, key, el) {
      if (!isCanvasDrawingTool() || (key !== 'ruler' && key !== 'triangle45' && key !== 'protractor')) return false;
      const inst = key === 'protractor' ? state.instruments.protractor : state.instruments[key];
      instrumentDrawing.active = true;
      instrumentDrawing.key = key;
      instrumentDrawing.pointerId = e.pointerId;
      instrumentDrawing.edge = null;
      if (key === 'triangle45') {
        const local = getInstrumentLocalPoint(e, inst, el);
        const leftEdge = 15 / 290 * local.w;
        const rightEdge = 275 / 290 * local.w;
        const topEdge = 15 / 290 * local.h;
        const bottomEdge = 275 / 290 * local.h;
        const clampedLeftY = Math.max(topEdge, Math.min(bottomEdge, local.y));
        const clampedBottomX = Math.max(leftEdge, Math.min(rightEdge, local.x));
        const leftDistance = Math.hypot(local.x - leftEdge, local.y - clampedLeftY);
        const bottomDistance = Math.hypot(local.x - clampedBottomX, local.y - bottomEdge);
        instrumentDrawing.edge = leftDistance <= bottomDistance ? 'left' : 'bottom';
      }
      instrumentDrawing.last = key === 'protractor' ? getBoardPoint(e) : constrainedInstrumentPoint(e, key, inst, el, instrumentDrawing.edge);
      saveCanvasState();
      el.setPointerCapture(e.pointerId);
      return true;
    }

    function moveInstrumentDrawing(e, el) {
      if (!instrumentDrawing.active || e.pointerId !== instrumentDrawing.pointerId) return;
      const key = instrumentDrawing.key;
      const inst = key === 'protractor' ? state.instruments.protractor : state.instruments[key];
      const next = key === 'protractor' ? getBoardPoint(e) : constrainedInstrumentPoint(e, key, inst, el, instrumentDrawing.edge);
      drawInstrumentSegment(instrumentDrawing.last, next);
      instrumentDrawing.last = next;
    }

    function finishInstrumentDrawing(e, el) {
      if (instrumentDrawing.active && e.pointerId === instrumentDrawing.pointerId) {
        instrumentDrawing.active = false;
        instrumentDrawing.key = null;
        instrumentDrawing.pointerId = null;
        instrumentDrawing.last = null;
        instrumentDrawing.edge = null;
        try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }

    protractorEl.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      if (beginInstrumentDrawing(e, 'protractor', protractorEl)) { e.preventDefault(); e.stopPropagation(); return; }
      e.preventDefault();
      e.stopPropagation();
      const p = state.instruments.protractor;
      const pt = getBoardPoint(e);
      if (e.target === protractorResizeHandle || e.target.closest('#protractorResizeHandle') ||
          e.target === protractorResizeHandleLeft || e.target.closest('#protractorResizeHandleLeft')) {
        // Merkez sabit kalır; iki uçtan da ölçeklendirme yapılabilir.
        const leftHandle = e.target === protractorResizeHandleLeft || !!e.target.closest('#protractorResizeHandleLeft');
        protractorGesture = { mode: 'pivot', pivotX: p.x, pivotY: p.y, side: leftHandle ? 'left' : 'right' };
      } else {
        protractorGesture = { mode: 'move', offsetX: pt.x - p.x, offsetY: pt.y - p.y };
      }
      protractorEl.setPointerCapture(e.pointerId);
    });

    protractorEl.addEventListener('pointermove', (e) => {
      if (instrumentDrawing.active) { moveInstrumentDrawing(e, protractorEl); e.preventDefault(); return; }
      if (!protractorGesture) return;
      e.preventDefault();
      const p = state.instruments.protractor;
      const pt = getBoardPoint(e);

      if (protractorGesture.mode === 'move') {
        p.x = pt.x - protractorGesture.offsetX;
        p.y = pt.y - protractorGesture.offsetY;
      } else {
        // Uç nokta doğrudan pointer konumuna eşittir.
        const dx = pt.x - protractorGesture.pivotX;
        const dy = pt.y - protractorGesture.pivotY;
        const distance = Math.hypot(dx, dy);
        p.radius = Math.max(80, Math.min(320, distance));
        const pointerAngle = Math.atan2(dy, dx) * 180 / Math.PI;
        // Sağ uç 0° yönünü, sol uç ise bunun tam karşısını temsil eder.
        p.angle = protractorGesture.side === 'left' ? pointerAngle - 180 : pointerAngle;
        p.x = protractorGesture.pivotX;
        p.y = protractorGesture.pivotY;
        renderProtractorGraphics();
      }
      updateProtractorTransform();
    });

    function finishProtractorGesture(e) {
      if (instrumentDrawing.active) { finishInstrumentDrawing(e, protractorEl); return; }
      protractorGesture = null;
      try { protractorEl.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    protractorEl.addEventListener('pointerup', finishProtractorGesture);
    protractorEl.addEventListener('pointercancel', finishProtractorGesture);

    function renderTriangle45Graphics() {
      const c = document.getElementById('triangle45Canvas');
      c.width = 290;
      c.height = 290;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

      ctx.beginPath();
      ctx.moveTo(15, 15);
      ctx.lineTo(15, 275);
      ctx.lineTo(275, 275);
      ctx.closePath();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(55, 95);
      ctx.lineTo(55, 235);
      ctx.lineTo(195, 235);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)';
      ctx.stroke();

      // Cetvel çizgileri: iki dik kenar boyunca santimetre ve yarım santimetre işaretleri.
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.lineWidth = 1.35;
      for (let d = 0; d <= 256; d += 8) {
        const len = d % 32 === 0 ? 10 : (d % 16 === 0 ? 7 : 4);
        ctx.beginPath(); ctx.moveTo(15, 275 - d); ctx.lineTo(15 + len, 275 - d); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(15 + d, 275); ctx.lineTo(15 + d, 275 - len); ctx.stroke();
        if (d > 0 && d % 32 === 0) {
          ctx.font = 'bold 11px Inter';
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.textAlign = 'center';
          ctx.strokeText(String(d / 32), 31, 275 - d + 4);
          ctx.strokeText(String(d / 32), 15 + d, 261);
          ctx.fillStyle = '#0f172a';
          ctx.fillText(String(d / 32), 31, 275 - d + 4);
          ctx.fillText(String(d / 32), 15 + d, 261);
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.95)';
        }
      }
    }

    // Mekanik Pergel Motoru
    const compassContainer = document.getElementById('compassContainer');
    const legPencil = document.getElementById('legPencil');
    const pencilAssembly = document.getElementById('pencilAssembly');
    const radiusHandleCircle = document.getElementById('radiusHandleCircle');
    const compassGuideCircle = document.getElementById('compassGuideCircle');
    const compassRadiusLine = document.getElementById('compassRadiusLine');
    const compassRadiusText = document.getElementById('compassRadiusText');
    const compassInfoBadge = document.getElementById('compassInfoBadge');
    const topRotationHandle = document.getElementById('topRotationHandle');
    const radiusHandle = document.getElementById('radiusHandle');
    const screwNut = document.getElementById('screwNut');
    const screwShaft = document.getElementById('screwShaft');

    function getPencilTipWorldPos() {
      const rad = state.compass.angle * (Math.PI / 180);
      const r = state.compass.radius;
      return {
        x: state.compass.x + r * Math.cos(rad),
        y: state.compass.y + r * Math.sin(rad)
      };
    }

    function updateCompassTransform() {
      const comp = state.compass;
      
      compassContainer.style.left = `${comp.x}px`;
      compassContainer.style.top = `${comp.y}px`;
      compassContainer.style.transform = `translate(-180px, -350px) rotate(${comp.angle}deg)`;
      compassContainer.style.transformOrigin = '180px 350px';

      const r = comp.radius;

      const hingeX = r / 2;
      document.getElementById('legNeedle').setAttribute('d', `M ${hingeX},-180 L 0,0`);
      document.getElementById('needleHighlight').setAttribute('d', `M ${hingeX-2},-168 L 2,-12`);
      document.getElementById('legPencil').setAttribute('d', `M ${hingeX},-180 L ${r},0`);
      document.getElementById('pencilHighlight').setAttribute('d', `M ${hingeX+2},-168 L ${r-3},-12`);
      document.getElementById('compassPivotOuter').setAttribute('cx', hingeX);
      document.getElementById('compassPivotOuter').setAttribute('cy', -180);
      document.getElementById('compassPivotMiddle').setAttribute('cx', hingeX);
      document.getElementById('compassPivotMiddle').setAttribute('cy', -180);
      document.getElementById('compassPivotInner').setAttribute('cx', hingeX);
      document.getElementById('compassPivotInner').setAttribute('cy', -180);
      topRotationHandle.setAttribute('transform', `translate(${hingeX-60},0)`);
      pencilAssembly.setAttribute('transform', `translate(${r}, 0)`);
      radiusHandleCircle.setAttribute('cx', r);

      screwShaft.setAttribute('d', `M ${hingeX-28},-108 L ${hingeX+28},-108`);
      document.getElementById('screwShaftHighlight').setAttribute('d', `M ${hingeX-26},-108 L ${hingeX+26},-108`);
      screwNut.setAttribute('cx', hingeX);
      screwNut.setAttribute('cy', -108);
      document.getElementById('screwNutInner').setAttribute('cx', hingeX);
      document.getElementById('screwNutInner').setAttribute('cy', -108);

      compassGuideCircle.setAttribute('r', r);
      compassRadiusLine.setAttribute('x2', r);
      compassInfoBadge.setAttribute('transform', `translate(${r / 2}, -18)`);

      const cmValue = (r / 32).toFixed(1);
      compassRadiusText.textContent = `${cmValue} cm`;
    }

    let isDraggingCompass = false;
    let compassDragStart = { x: 0, y: 0 };

    compassContainer.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#topRotationHandle') || e.target.closest('#radiusHandle')) return;
      e.stopPropagation();
      isDraggingCompass = true;
      compassDragStart = { x: e.clientX - state.compass.x, y: e.clientY - state.compass.y };
      compassContainer.setPointerCapture(e.pointerId);
    });

    compassContainer.addEventListener('pointermove', (e) => {
      if (isDraggingCompass) {
        state.compass.x = e.clientX - compassDragStart.x;
        state.compass.y = e.clientY - compassDragStart.y;
        updateCompassTransform();
      }
    });

    compassContainer.addEventListener('pointerup', (e) => {
      isDraggingCompass = false;
      try { compassContainer.releasePointerCapture(e.pointerId); } catch(err){}
    });

    let isAdjustingCompassRadius = false;

    radiusHandle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      isAdjustingCompassRadius = true;
      radiusHandle.setPointerCapture(e.pointerId);
    });

    radiusHandle.addEventListener('pointermove', (e) => {
      if (isAdjustingCompassRadius) {
        const rect = compassContainer.getBoundingClientRect();
        const svgCenterX = rect.left + 180;
        const svgCenterY = rect.top + 350;
        const dx = e.clientX - svgCenterX;
        const dy = e.clientY - svgCenterY;
        
        const newRadius = Math.max(30, Math.min(300, Math.hypot(dx, dy)));
        state.compass.radius = newRadius;
        updateCompassTransform();
      }
    });

    radiusHandle.addEventListener('pointerup', (e) => {
      isAdjustingCompassRadius = false;
      try { radiusHandle.releasePointerCapture(e.pointerId); } catch(err){}
    });

    let isRotatingCompassAndDrawing = false;
    let previousPointerAngle = null;
    let previousCompassAngle = 0;

    function pointerAngleAroundCompass(e) {
      const rect = workspace.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      return Math.atan2(py - state.compass.y, px - state.compass.x);
    }

    topRotationHandle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      saveCanvasState();
      isRotatingCompassAndDrawing = true;
      previousPointerAngle = pointerAngleAroundCompass(e);
      previousCompassAngle = state.compass.angle * Math.PI / 180;
      topRotationHandle.setPointerCapture(e.pointerId);
    });

    topRotationHandle.addEventListener('pointermove', (e) => {
      if (!isRotatingCompassAndDrawing) return;

      const pointerAngle = pointerAngleAroundCompass(e);
      let delta = pointerAngle - previousPointerAngle;
      if (delta > Math.PI) delta -= Math.PI * 2;
      if (delta < -Math.PI) delta += Math.PI * 2;

      if (Math.abs(delta) > 0.00001) {
        const nextCompassAngle = previousCompassAngle + delta;
        const tipX = state.compass.x;
        const tipY = state.compass.y;
        const radius = state.compass.radius;

        drawCtx.save();
        drawCtx.beginPath();
        drawCtx.arc(tipX, tipY, radius, previousCompassAngle, nextCompassAngle, delta < 0);
        drawCtx.strokeStyle = state.penColor;
        drawCtx.lineWidth = state.penWidth;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.globalAlpha = state.currentTool === 'highlighter' ? 0.35 : 1.0;
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.stroke();
        drawCtx.restore();

        previousCompassAngle = nextCompassAngle;
        state.compass.angle += delta * 180 / Math.PI;
        updateCompassTransform();
      }
      previousPointerAngle = pointerAngle;
    });

    function stopCompassRotation(e) {
      isRotatingCompassAndDrawing = false;
      previousPointerAngle = null;
      try { topRotationHandle.releasePointerCapture(e.pointerId); } catch(err) {}
    }
    topRotationHandle.addEventListener('pointerup', stopCompassRotation);
    topRotationHandle.addEventListener('pointercancel', stopCompassRotation);

    function setupInstrumentInteractions(elementId, key) {
      const el = document.getElementById(elementId);
      let isDragging = false, isRotating = false, isResizing = false;
      let startX = 0, startY = 0, startAngle = 0, startPointerAngle = 0;
      let startWidth = 0, startHeight = 0;

      el.addEventListener('pointerdown', (e) => {
        if (beginInstrumentDrawing(e, key, el)) { e.preventDefault(); e.stopPropagation(); return; }
        e.preventDefault();
        e.stopPropagation();
        const action = e.target.getAttribute('data-action');
        const inst = state.instruments[key];
        const rect = workspace.getBoundingClientRect();
        const width = el.offsetWidth, height = el.offsetHeight;
        if (action === 'rotate') {
          isRotating = true;
          startAngle = inst.angle;
          const cx = rect.left + inst.x + width / 2;
          const cy = rect.top + inst.y + height / 2;
          startPointerAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
        } else if (action === 'resize') {
          isResizing = true;
          startWidth = width;
          startHeight = height;
        } else {
          isDragging = true;
        }
        startX = e.clientX;
        startY = e.clientY;
        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener('pointermove', (e) => {
        if (instrumentDrawing.active) { moveInstrumentDrawing(e, el); return; }
        const inst = state.instruments[key];
        if (!inst.visible) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (isDragging) {
          inst.x += dx;
          inst.y += dy;
          startX = e.clientX;
          startY = e.clientY;
          applyTransform(el, inst);
        } else if (isRotating) {
          const rect = workspace.getBoundingClientRect();
          const cx = rect.left + inst.x + el.offsetWidth / 2;
          const cy = rect.top + inst.y + el.offsetHeight / 2;
          const currentPointerAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
          let delta = currentPointerAngle - startPointerAngle;
          if (delta > Math.PI) delta -= Math.PI * 2;
          if (delta < -Math.PI) delta += Math.PI * 2;
          inst.angle = startAngle + delta * 180 / Math.PI;
          applyTransform(el, inst);
        } else if (isResizing) {
          if (key === 'ruler') {
            inst.width = Math.max(200, Math.min(900, startWidth + dx));
            el.style.width = `${inst.width}px`;
            renderRulerGraphics();
          } else {
            const minSize = 150;
            const scale = Math.max(minSize / startWidth, Math.max(minSize / startHeight, Math.min(2.5, Math.max(0.4, 1 + Math.max(dx / startWidth, dy / startHeight)))));
            el.style.width = `${startWidth * scale}px`;
            el.style.height = `${startHeight * scale}px`;
          }
        }
      });

      el.addEventListener('pointerup', (e) => {
        if (instrumentDrawing.active) { finishInstrumentDrawing(e, el); return; }
        isDragging = isRotating = isResizing = false;
        try { el.releasePointerCapture(e.pointerId); } catch(err){}
      });
      el.addEventListener('pointercancel', (e) => {
        if (instrumentDrawing.active) { finishInstrumentDrawing(e, el); return; }
        isDragging = isRotating = isResizing = false;
      });
    }

    function applyTransform(el, inst) {
      el.style.transformOrigin = 'center center';
      el.style.transform = `translate3d(${inst.x}px, ${inst.y}px, 0px) rotate(${inst.angle}deg)`;
    }

    setupInstrumentInteractions('ruler', 'ruler');
    setupInstrumentInteractions('triangle45', 'triangle45');

    function bindToggle(btnId, toolKey, elId) {
      const btn = document.getElementById(btnId);
      const el = document.getElementById(elId);

      btn.addEventListener('click', () => {
        state.instruments[toolKey].visible = !state.instruments[toolKey].visible;
        if (state.instruments[toolKey].visible) {
          el.classList.remove('hidden');
          btn.classList.add('bg-indigo-600', 'text-white');
          if (toolKey === 'protractor') {
            updateProtractorTransform();
          } else {
            applyTransform(el, state.instruments[toolKey]);
          }
        } else {
          el.classList.add('hidden');
          btn.classList.remove('bg-indigo-600', 'text-white');
        }
      });
    }

    bindToggle('btnRuler', 'ruler', 'ruler');
    bindToggle('btnProtractor', 'protractor', 'protractor');
    bindToggle('btnTriangle45', 'triangle45', 'triangle45');

    const btnCompass = document.getElementById('btnCompass');
    btnCompass.addEventListener('click', () => {
      state.compass.visible = !state.compass.visible;
      if (state.compass.visible) {
        compassContainer.classList.remove('hidden');
        btnCompass.classList.add('bg-indigo-600', 'text-white');
        updateCompassTransform();
      } else {
        compassContainer.classList.add('hidden');
        btnCompass.classList.remove('bg-indigo-600', 'text-white');
      }
    });

    window.onload = () => {
      resizeCanvases();
      updatePageIndicator();
    };
  </script>
</body>
</html>
